function buildAdminSettings() {
  const dirty = pendingSettings !== null;
  const curName = dirty ? (pendingSettings._name ?? S.tournamentName) : S.tournamentName;
  const totalStages = S.stages.length;

  return `<div class="section">
    ${dirty ? `<div style="background:rgba(240,23,138,.1);border:1px solid rgba(240,23,138,.3);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--accent);font-weight:600;">Unsaved changes</div>` : ''}

    <div class="card">
      <div class="card-header"><div class="card-title">Tournament</div></div>
      <div style="padding:12px 16px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--border)">
        <div class="field">
          <div class="label">Tournament Name</div>
          <input type="text" class="input" id="settings-name-inp" value="${escH(curName)||''}" placeholder="Tournament name">
        </div>
        <div class="field">
          <div class="label">Number of Stages</div>
          <div class="seg">${[1,2,3,4,5].map(n=>`<button class="seg-btn ${totalStages===n?'active':''}" data-a="setTotalStages" data-v="${n}">${n}</button>`).join('')}</div>
        </div>
        <button class="btn btn-primary btn-sm" data-a="saveSettings">Save</button>
      </div>
    </div>

    <div class="divider"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
      <div class="section-title" style="margin:0">Stage Settings</div>
      <span style="font-size:11px;color:var(--green);font-weight:600">✓ Auto-saves</span>
    </div>

    ${totalStages === 0
      ? `<div style="padding:14px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;font-size:13px;color:var(--muted);text-align:center">Set the number of stages above to get started.</div>`
      : S.stages.map(stage => `<div class="card">
          <div class="card-header" style="padding:12px 14px;border-bottom:1px solid var(--border)">
            <div class="card-title" style="font-size:14px">${escH(stage.name)}</div>
          </div>
          <div style="padding:12px 16px">${buildStageSettingsPanel(stage)}</div>
        </div>`).join('')
    }

    <div class="divider"></div>
    <button class="btn btn-danger btn-full btn-sm" data-a="resetAll">⚠ Reset Tournament</button>
    <button class="btn btn-full btn-sm" style="background:var(--surface2);border:1px solid var(--border);color:var(--text)" data-a="archiveTournament">${S.archived ? '📤 Unarchive Tournament' : '📦 Archive Tournament'}</button>
    <button class="btn btn-full btn-sm" style="background:rgba(180,30,30,.12);border:1px solid rgba(180,30,30,.35);color:#e05555" data-a="deleteTournament">🗑 Delete Tournament</button>
  </div>`;
}

function buildAdminPlayers() {
  const cols = S.collections;
  const byCol = {}, none = [];
  S.participants.forEach(p => {
    p.collectionId ? (byCol[p.collectionId]=byCol[p.collectionId]||[]).push(p) : none.push(p);
  });

  let listHtml = '';
  cols.forEach(c => {
    const ps = byCol[c.id]||[];
    if (!ps.length) return;
    listHtml += `<div class="card" style="margin:0">
      <div class="card-header" style="border-bottom:1px solid var(--border);border-left:3px solid ${c.color}">
        <div class="card-title" style="color:${c.color}">${escH(c.name)}</div>
        <span class="badge badge-muted">${ps.length}</span>
      </div>
      ${ps.map(p=>playerRow(p)).join('')}
    </div>`;
  });
  if (none.length) {
    listHtml += `<div class="card" style="margin:0">
      ${cols.length?`<div class="card-header" style="border-bottom:1px solid var(--border)"><div class="card-title text-muted">No Collection</div></div>`:''}
      ${none.map(p=>playerRow(p)).join('')}
    </div>`;
  }

  return `<div class="section" style="gap:12px">
    <div class="card">
      <div class="card-header">
        <div class="card-title">Collections</div>
        <button class="btn btn-ghost btn-xs" data-a="toggleForm" data-f="col-form">+ Add</button>
      </div>
      <div id="col-form" class="hidden" style="padding:12px 16px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--border)">
        <input type="text" class="input input-sm" id="col-name" placeholder="e.g. Kids, Beginners, Advanced">
        <div style="display:flex;gap:10px;align-items:center">
          <input type="color" id="col-color" value="#4f8ef7">
          <span class="text-muted" style="font-size:13px">Pick a color</span>
        </div>
        <div class="btn-row">
          <button class="btn btn-primary btn-sm" data-a="addCollection">Add Collection</button>
          <button class="btn btn-ghost btn-sm" data-a="toggleForm" data-f="col-form">Cancel</button>
        </div>
      </div>
      ${cols.length===0?`<div style="padding:12px 16px;font-size:13px;color:var(--muted)">Optional: group players by skill level or age.</div>`:''}
      ${cols.length?`<div style="padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid var(--border)">
        ${cols.map(c=>`<div class="chip"><span class="chip-dot" style="background:${c.color}"></span>${escH(c.name)}<button class="btn-icon red" data-a="deleteCollection" data-id="${c.id}" style="font-size:14px;padding:0 2px">×</button></div>`).join('')}
      </div>`:''}
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title">Players <span class="badge badge-muted">${S.participants.length}</span></div>
        <button class="btn btn-ghost btn-xs" data-a="toggleForm" data-f="part-form">+ Add New</button>
      </div>
      ${(()=>{
        const inTournamentKeys = new Set(S.participants.map(p=>playerLibraryKey(p.name)));
        const available = playerLibrary.filter(lp=>!inTournamentKeys.has(lp.key)).sort((a,b)=>a.name.localeCompare(b.name));
        if (!available.length) return '';
        return `<div style="padding:10px 14px;border-top:1px solid var(--border)">
          <div style="font-size:11px;color:var(--muted);font-weight:600;margin-bottom:8px;letter-spacing:0.05em">RETURNING PLAYERS</div>
          <div style="display:flex;flex-wrap:wrap;gap:8px">
            ${available.map(lp=>{
              const photo = lp.photo ? `background-image:url(${lp.photo});background-size:cover;background-position:center;color:transparent;` : '';
              const ini = lp.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
              return `<button data-a="editLibraryPlayer" data-key="${escH(lp.key)}"
                style="display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;cursor:pointer;padding:4px">
                <div class="bracket-avatar" style="${photo};pointer-events:none">${photo?'':escH(ini)}</div>
                <div style="font-size:11px;color:var(--text);max-width:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escH(lp.name.split(' ')[0])}</div>
              </button>`;
            }).join('')}
          </div>
        </div>`;
      })()}
      <div id="part-form" class="hidden" style="padding:12px 16px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--border)">
        <input type="text" class="input input-sm" id="part-name" placeholder="Player name">
        ${cols.length?`<select class="input input-sm" id="part-col">
          <option value="">No collection</option>
          ${cols.map(c=>`<option value="${c.id}">${escH(c.name)}</option>`).join('')}
        </select>`:''}
        <div class="btn-row">
          <button class="btn btn-primary btn-sm" data-a="addPlayer">Add Player</button>
          <button class="btn btn-ghost btn-sm" data-a="toggleForm" data-f="part-form">Cancel</button>
        </div>
      </div>
      ${!S.participants.length?`<div style="padding:12px 16px;font-size:13px;color:var(--muted)">Add players to get started.</div>`:''}
    </div>

    ${listHtml}
  </div>`;
}

function playerRow(p) {
  const c = p.collectionId ? getCol(p.collectionId) : null;
  const bg = avatarBg(p.id);
  const avStyle = bg ? bg : (c ? `border-color:${c.color};color:${c.color}` : '');
  return `<div class="list-row">
    <div class="bracket-avatar" data-a="openPhotoCrop" data-pid="${p.id}" title="Change photo" style="${avStyle};cursor:pointer">
      ${bg?'':escH(initials(p.name))}
    </div>
    <div style="flex:1">
      <div style="font-size:15px;font-weight:600">${escH(p.name)}</div>
      ${c?`<div style="font-size:12px;color:var(--muted)">${escH(c.name)}</div>`:''}
    </div>
    ${S.collections.length?`<select class="input input-sm" data-a="setPlayerCol" data-id="${p.id}" style="width:auto;min-width:100px">
      <option value="">None</option>
      ${S.collections.map(c2=>`<option value="${c2.id}" ${p.collectionId===c2.id?'selected':''}>${escH(c2.name)}</option>`).join('')}
    </select>`:''}
    <button class="btn-icon" data-a="openPhotoCrop" data-pid="${p.id}" title="Add/change photo" style="font-size:16px">📷</button>
    <button class="btn-icon red" data-a="deletePlayer" data-id="${p.id}">×</button>
  </div>`;
}

function stageAssignmentMode(stageId) {
  const idx = S.stages.findIndex(s => s.id === stageId);
  const lastIdx = S.stages.length - 1;
  // Group Assignment setting only applies to stage 1; later stages use advancement logic
  if (idx === 0) {
    const ss = getStageSettings(stageId);
    if (ss.groupAssignment === 'random') return 'random';
    return 'manual';
  }
  if (idx === lastIdx) return S.settings.finalsAssignment || 'auto';
  return 'collection';
}

function groupStatusBadge(status) {
  if (status === 'active') return `<span class="badge badge-blue">● Active</span>`;
  if (status === 'final')  return `<span class="badge badge-green">✓ Final</span>`;
  return `<span class="badge badge-muted">Not Started</span>`;
}

function buildStageSettingsPanel(stage) {
  const ss = getStageSettings(stage.id);
  const sid = stage.id;
  return `<div style="display:flex;flex-direction:column;gap:12px">
    <div class="field">
      <div class="label" style="font-size:11px">Max Players/Group</div>
      <div class="seg">${[2,3,4,5].map(n=>`<button class="seg-btn ${ss.gameSize===n?'active':''}" data-a="setStageSetting" data-sid="${sid}" data-k="gameSize" data-v="${n}">${n}</button>`).join('')}</div>
    </div>
    <div class="field">
      <div class="label" style="font-size:11px">Min Players/Group</div>
      <div class="seg">${[2,3,4,5].map(n=>`<button class="seg-btn ${ss.minGroupSize===n?'active':''}" data-a="setStageSetting" data-sid="${sid}" data-k="minGroupSize" data-v="${n}">${n}</button>`).join('')}</div>
    </div>
    <div class="field">
      <div class="label" style="font-size:11px">Games per Stage</div>
      <div class="seg">${[1,2,3,4,5].map(n=>`<button class="seg-btn ${ss.gamesPerStage===n?'active':''}" data-a="setStageSetting" data-sid="${sid}" data-k="gamesPerStage" data-v="${n}">${n}</button>`).join('')}</div>
    </div>
    <div class="field">
      <div class="label" style="font-size:11px">Points to Win</div>
      <input type="number" class="input input-sm" value="${ss.pointsToWin}" data-a="setStageSettingNum" data-sid="${sid}" data-k="pointsToWin" inputmode="numeric" min="1">
    </div>
    ${S.stages.findIndex(s => s.id === sid) === 0 ? `<div class="field">
      <div class="label" style="font-size:11px">Group Assignment</div>
      <div class="seg">
        <button class="seg-btn ${ss.groupAssignment!=='random'?'active':''}" data-a="setStageSetting" data-sid="${sid}" data-k="groupAssignment" data-v="manual">Manual</button>
        <button class="seg-btn ${ss.groupAssignment==='random'?'active':''}" data-a="setStageSetting" data-sid="${sid}" data-k="groupAssignment" data-v="random">Random</button>
      </div>
    </div>` : ''}
    <div class="field">
      <div class="label" style="font-size:11px">After Each Game</div>
      <div class="seg">
        <button class="seg-btn ${!ss.shuffleAfterGame?'active':''}" data-a="setStageSetting" data-sid="${sid}" data-k="shuffleAfterGame" data-v="false">Keep Group</button>
        <button class="seg-btn ${ss.shuffleAfterGame?'active':''}" data-a="setStageSetting" data-sid="${sid}" data-k="shuffleAfterGame" data-v="true">Shuffle</button>
      </div>
    </div>
    <div class="field">
      <div class="label" style="font-size:11px">Collections</div>
      <div class="seg">
        <button class="seg-btn ${!ss.mixCollections?'active':''}" data-a="setStageSetting" data-sid="${sid}" data-k="mixCollections" data-v="false">Stay Separated</button>
        <button class="seg-btn ${ss.mixCollections?'active':''}" data-a="setStageSetting" data-sid="${sid}" data-k="mixCollections" data-v="true">Mix Together</button>
      </div>
    </div>
    ${!ss.isFinal ? `
    <div class="field">
      <div class="label" style="font-size:11px">Advancement Method</div>
      <div class="seg">
        <button class="seg-btn ${ss.advancementMethod==='wins'?'active':''}" data-a="setStageSetting" data-sid="${sid}" data-k="advancementMethod" data-v="wins">Most Wins</button>
        <button class="seg-btn ${ss.advancementMethod==='points'?'active':''}" data-a="setStageSetting" data-sid="${sid}" data-k="advancementMethod" data-v="points">Most Points</button>
      </div>
    </div>
    <div class="field">
      <div class="label" style="font-size:11px">Players Advancing/Collection</div>
      <div class="seg">${[1,2,3,4,5].map(n=>`<button class="seg-btn ${ss.advancersPerCollection===n?'active':''}" data-a="setStageSetting" data-sid="${sid}" data-k="advancersPerCollection" data-v="${n}">${n}</button>`).join('')}</div>
    </div>` : ''}
    <div class="field">
      <div class="label" style="font-size:11px">Stage Type</div>
      <div class="seg">
        <button class="seg-btn ${!ss.isFinal?'active':''}" data-a="setStageSetting" data-sid="${sid}" data-k="isFinal" data-v="false">Advance Players</button>
        <button class="seg-btn ${ss.isFinal?'active':''}" data-a="setStageSetting" data-sid="${sid}" data-k="isFinal" data-v="true">Final Stage</button>
      </div>
    </div>
  </div>`;
}

function buildAdminStages() {
  const totalStages = S.stages.length;
  const lastStage = totalStages > 0 ? S.stages[totalStages - 1] : null;
  const canAdd = !lastStage || stageIsFullyDone(lastStage.id);

  return `<div class="section" style="gap:12px">
    <div>
      <button class="btn btn-primary btn-sm" data-a="addStage" ${canAdd?'':'disabled style="opacity:0.45;cursor:not-allowed"'}>+ Add Stage</button>
      ${!canAdd ? `<div style="font-size:12px;color:var(--muted);margin-top:6px">Complete all games in ${escH(lastStage.name)} to unlock the next stage.</div>` : ''}
    </div>

    ${totalStages===0?`<div class="empty"><div class="empty-icon">🏆</div><p>Set the number of stages in the Settings tab to get started.</p></div>`:''}

    ${S.stages.map((stage, stageIdx) => {
      const ss = getStageSettings(stage.id);
      const stageGroups = activeGroupsForStage(stage.id);
      const ua = unassigned(stage.id);
      const mode = stageAssignmentMode(stage.id);
      const isManual = mode === 'manual';
      const isFirstStage = stageIdx === 0;
      const isFinals = ss.isFinal || (stageIdx === totalStages - 1 && totalStages > 1);
      const isLaterStage = !isFirstStage && !isFinals;
      const stageDone = stageIsFullyDone(stage.id);
      const stageHasGames = S.games.some(game => {
        const g = getGroup(game.groupId);
        return g && g.stageId === stage.id;
      });
      const gpsA = ss.gamesPerStage || 1;

      // Stage-level status
      const stageBadge = stage.status === 'complete'
        ? `<span class="badge badge-green">Complete</span>`
        : stageDone
          ? `<span class="badge badge-gold">All Done</span>`
          : stageHasGames
            ? `<span class="badge badge-blue">In Progress</span>`
            : `<span class="badge badge-muted">Not Started</span>`;

      const assignBtn = stage.status !== 'complete' ? (
        mode === 'random' ? (stageHasGames
          ? `<button class="btn btn-ghost btn-xs" disabled title="Scores entered — cannot re-shuffle" style="opacity:0.45;cursor:not-allowed">🔀 Re-shuffle</button>`
          : stageGroups.length > 0
            ? `<button class="btn btn-ghost btn-xs" data-a="randomizeStage" data-sid="${stage.id}">🔀 Re-shuffle</button>`
            : `<button class="btn btn-primary btn-sm" data-a="randomizeStage" data-sid="${stage.id}">🔀 Randomize Groups</button>`) :
        isLaterStage && mode === 'collection' ? `<button class="btn btn-ghost btn-xs" data-a="autoAssignFromPrev" data-sid="${stage.id}">↑ Auto-assign</button>` :
        isFinals && mode === 'auto' ? `<button class="btn btn-ghost btn-xs" data-a="generateFinals" data-sid="${stage.id}">🏆 Generate Finals</button>` : ''
      ) : '';

      return `<div class="card">
        <div class="card-header">
          <div style="flex:1">
            <div class="card-title">${escH(stage.name)}${isFinals?` <span style="font-size:11px;color:var(--gold)">★ Final</span>`:''}</div>
            ${gpsA > 1 ? `<div style="font-size:12px;color:var(--muted);margin-top:2px">${gpsA} games required per group</div>` : ''}
          </div>
          <div class="btn-row">
            ${stage.status !== 'complete' && mode !== 'random' ? `<button class="btn btn-ghost btn-xs" data-a="addGroup" data-sid="${stage.id}">+ Group</button>` : ''}
            ${assignBtn}
            ${stageBadge}
          </div>
        </div>

        ${stageGroups.length === 0 ? `<div style="padding:12px 14px;font-size:13px;color:var(--muted)">${mode==='random'?'Tap Randomize Groups to auto-assign all players.':isManual?'Add groups and assign players manually.':isFinals?'Use Generate Finals to auto-create the finals group.':'Use Auto-assign to pull advancers from the previous stage.'}</div>` : ''}

        ${stageGroups.map(group => {
          const gStatus = groupStatus(group.id, stage.id);
          const active = activeGameForGroup(group.id);
          const done = completedGamesForGroup(group.id);
          return `<div style="border-top:1px solid var(--border);padding:12px 14px">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:${group.participantIds.length?'8':'0'}px">
              <div style="font-size:14px;font-weight:700;flex:1">${escH(group.name)}</div>
              ${groupStatusBadge(gStatus)}
              ${done.length ? `<span style="font-size:11px;color:var(--muted)">${done.length}/${gpsA} game${gpsA!==1?'s':''}</span>` : ''}
              <button class="btn-icon red" data-a="deleteGroup" data-id="${group.id}">×</button>
            </div>
            ${group.participantIds.length ? `<div class="chips">
              ${group.participantIds.map(pid => {
                const p = getPart(pid);
                const col = p?.collectionId ? getCol(p.collectionId) : null;
                return `<div class="chip">${col?`<span class="chip-dot" style="background:${col.color}"></span>`:''}${escH(p?.name||'?')}${isManual&&gStatus==='pending'?`<button class="btn-icon" data-a="removeFromGroup" data-gid="${group.id}" data-pid="${pid}" style="font-size:12px;padding:0 2px">×</button>`:''}</div>`;
              }).join('')}
            </div>` : ''}
            ${isManual && ua.length > 0 && gStatus === 'pending' ? `<div style="margin-top:8px;display:flex;gap:6px">
              <select class="input input-sm" id="atg-${group.id}" style="flex:1">
                <option value="">Add player…</option>
                ${ua.map(p=>`<option value="${p.id}">${escH(p.name)}</option>`).join('')}
              </select>
              <button class="btn btn-ghost btn-sm" data-a="addToGroup" data-gid="${group.id}">Add</button>
            </div>` : ''}
            ${!active && done.length ? `<div style="margin-top:8px"><button class="btn btn-ghost btn-xs" data-a="reopenGame" data-id="${done[done.length-1].id}">↩ Reopen Last Game</button></div>` : ''}
          </div>`;
        }).join('')}

        ${isManual && ua.length > 0 && stageGroups.length > 0 ? `<div style="padding:8px 14px;font-size:12px;color:var(--muted);border-top:1px solid var(--border)">${ua.length} player${ua.length!==1?'s':''} not yet assigned to a group</div>` : ''}
        ${mode === 'random' && stageGroups.length > 0 && !stageHasGames ? `<div style="padding:8px 14px;font-size:12px;color:var(--muted);border-top:1px solid var(--border)">Tap Re-shuffle to generate a different grouping.</div>` : ''}
        ${stageDone && stage.status !== 'complete' ? `<div style="padding:10px 14px;font-size:13px;color:var(--green);border-top:1px solid var(--border);font-weight:600">✓ All games complete. ${isFinals ? 'Declare the winner!' : 'Ready to advance players to the next stage.'}</div>` : ''}
        ${stageDone && !isFinals && hasAdvancerTie(stage.id) ? `<div style="padding:10px 14px;font-size:13px;color:var(--gold);border-top:1px solid var(--border);font-weight:600">⚠️ Advancement tie detected — all tied players will be included in the next stage.</div>` : ''}

        ${(() => {
          const catchupPids = (S.catchupQueue && S.catchupQueue[stage.id]) || [];
          if (!catchupPids.length) return '';
          const catchupSS = getStageSettings(stage.id);
          const catchupGPS = catchupSS.gamesPerStage || 1;
          return `<div style="border-top:1px solid var(--border);padding:12px 14px;background:rgba(255,180,0,0.06)">
            <div style="font-size:12px;font-weight:700;color:var(--gold);margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em">⏳ Catch-up Required</div>
            ${catchupPids.map(cpid => {
              const cp = getPart(cpid);
              if (!cp) return '';
              const catchupGroup = S.groups.find(g => g.stageId === stage.id && g.isCatchup && g.catchupPlayerId === cpid);
              const catchupGame = catchupGroup ? activeGameForGroup(catchupGroup.id) : null;
              const catchupDone = catchupGroup ? completedGamesForGroup(catchupGroup.id) : [];
              const seriesComplete = catchupDone.length >= catchupGPS;
              if (catchupGroup && seriesComplete) {
                const won = catchupPlayerAdvances(cpid, catchupGroup.id, stage.id, catchupSS);
                return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
                  <span style="font-size:13px;font-weight:600">${escH(cp.name)}</span>
                  <span class="badge ${won?'badge-green':'badge-muted'}">${won?'Advanced':'Eliminated'}</span>
                </div>`;
              }
              if (catchupGame) {
                return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
                  <span style="font-size:13px;font-weight:600">${escH(cp.name)}</span>
                  <span class="badge badge-blue">Game ${catchupDone.length + 1}/${catchupGPS} in progress</span>
                  <button class="btn btn-ghost btn-xs" data-a="openScorecard" data-gid="${catchupGroup.id}">Score</button>
                </div>`;
              }
              if (catchupGroup && catchupDone.length > 0) {
                return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
                  <span style="font-size:13px;font-weight:600">${escH(cp.name)}</span>
                  <span style="font-size:12px;color:var(--muted)">${catchupDone.length}/${catchupGPS} games done</span>
                  <button class="btn btn-primary btn-xs" data-a="startNextCatchupGame" data-gid="${catchupGroup.id}">Start Game ${catchupDone.length + 1}</button>
                </div>`;
              }
              return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
                <span style="font-size:13px;font-weight:600">${escH(cp.name)}</span>
                ${catchupGPS > 1 ? `<span style="font-size:12px;color:var(--muted)">${catchupGPS} games required</span>` : ''}
                <button class="btn btn-primary btn-xs" data-a="startCatchupGame" data-sid="${stage.id}" data-pid="${cpid}">Start Catch-up Game</button>
              </div>`;
            }).join('')}
          </div>`;
        })()}

        <div style="border-top:1px solid var(--border);padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap">
          ${stage.status === 'active' ? `<button class="btn btn-ghost btn-xs" data-a="markStageComplete" data-id="${stage.id}"
              ${!stageDone ? 'disabled style="opacity:0.4;cursor:not-allowed" title="All groups must submit scores first"' : ''}>Mark Complete</button>
              ${!stageDone ? `<span style="font-size:11px;color:var(--muted)">All groups must submit scores first</span>` : ''}` : ''}
          <button class="btn btn-danger btn-xs" data-a="deleteStage" data-id="${stage.id}">Delete Stage</button>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

function buildAdminStandings() {

  });

function bindEvents() {
  const app = document.getElementById('app');
  app.removeEventListener('click', onClick);
  app.removeEventListener('change', onChange);
  app.removeEventListener('keydown', onKey);
  app.addEventListener('click', onClick);
  app.addEventListener('change', onChange);
  app.addEventListener('keydown', onKey);
}

function onClick(e) {
  const el = e.target.closest('[data-a]');
  if (!el) return;
  const a=el.dataset.a, v=el.dataset.v, id=el.dataset.id,
        gid=el.dataset.gid, sid=el.dataset.sid, pid=el.dataset.pid;

  if (a==='setMode' && v==='admin') { upd({adminAuthModal:true}); return; }
  else if (a==='setMode') upd({mode:v, screen:'home'});
  else if (a==='openAdminAuth') upd({adminAuthModal:true});
  else if (a==='setScreen') { if (navigator.vibrate) navigator.vibrate(8); upd({screen:v}); }
  else if (a==='back') { S.screen='groups'; S.scoringModal=null; render(); }
  else if (a==='setAdminTab') { pendingSettings=null; upd({adminTab:v}); }
  else if (a==='setLbSort') upd({lbSort:v});
  else if (a==='setLbStage') upd({lbStage:v});

  else if (a==='setPlayerGameFilter') { S.playerGameFilter=Number(v); render(); }
  else if (a==='setSetting') {
    let val=v;
    if(v==='true') val=true; else if(v==='false') val=false; else if(!isNaN(+v)) val=+v;
    if(!pendingSettings) pendingSettings={...S.settings, _name: S.tournamentName};
    pendingSettings={...pendingSettings,[el.dataset.k]:val};
    render();
  }
  else if (a==='saveSettings') {
    const nameInp=document.getElementById('settings-name-inp');
    const name=nameInp?nameInp.value.trim():S.tournamentName;
    if(pendingSettings){const{_name,...rest}=pendingSettings;S.settings={...rest};}
    S.tournamentName=name||S.tournamentName;
    pendingSettings=null;
    save(); render();
    // Flash confirmation
    const btn=document.querySelector('[data-a="saveSettings"]');
    if(btn){const orig=btn.textContent;btn.textContent='✓ Saved!';btn.style.opacity='0.7';setTimeout(()=>{btn.textContent=orig;btn.style.opacity='';},1500);}
  }
  else if (a==='toggleForm') {

  }
  else if (a==='addCollection') doAddCollection();
  else if (a==='deleteCollection') doDeleteCollection(id);
  else if (a==='addPlayer') doAddPlayer();
  else if (a==='deletePlayer') doDeletePlayer(id);
  else if (a==='addFromLibrary') {
    const key = el.dataset.key;
    const lp = playerLibrary.find(p => p.key === key);
    if (!lp) return;
    const col = null;
    const newId = uid();
    S.participants.push({ id: newId, name: lp.name, collectionId: col });
    if (lp.photo) {
      photoCache[newId] = lp.photo;
      savePhotoToFirestore(newId, lp.photo);
    }
    S.libraryEditModal = null;
    save(); render();
  }
  else if (a==='editLibraryPlayer') { upd({ libraryEditModal: el.dataset.key }); }
  else if (a==='closeLibraryEdit') { upd({ libraryEditModal: null }); }
  else if (a==='changeLibraryPhoto') { openFilePicker(null, el.dataset.key); }
  else if (a==='saveLibraryPlayer') {
    const key = el.dataset.key;
    const newName = document.getElementById('lib-name-inp')?.value.trim();
    if (!newName) return;
    const lib = loadLibraryLS();
    if (!lib[key]) { upd({ libraryEditModal: null }); return; }
    const newKey = playerLibraryKey(newName);
    const entry = { ...lib[key], name: newName, updatedAt: Date.now() };
    if (newKey !== key) { delete lib[key]; }
    lib[newKey] = entry;
    saveLibrary(lib);
    upd({ libraryEditModal: null });
  }
  else if (a==='deleteLibraryPlayer') {
    const key = el.dataset.key;
    if (!confirm('Remove this player from the library?')) return;
    const lib = loadLibraryLS();
    delete lib[key];
    saveLibrary(lib);
    upd({ libraryEditModal: null });
  }
  else if (a==='addStage') doAddStage();
  else if (a==='deleteStage') doDeleteStage(id);
  else if (a==='setTotalStages') doSetTotalStages(parseInt(v));
  else if (a==='toggleStageSettings') {
    if (openStageSettingsPanels.has(sid)) openStageSettingsPanels.delete(sid);
    else openStageSettingsPanels.add(sid);
    render();
  }
  else if (a==='setStageSetting') {
    const stg = getStage(sid);
    if (!stg) return;
    let val = v;
    if (v==='true') val=true; else if (v==='false') val=false; else if (!isNaN(+v)) val=+v;
    stg.settings = { ...(stg.settings||{}), [el.dataset.k]: val };
    save(); render();
  }
  else if (a==='markStageComplete') { const st=getStage(id); if(st){ if(!stageIsFullyDone(st.id)){alert('All groups must submit scores before marking this stage complete.');return;} st.status='complete';save();render();} }
  else if (a==='startCatchupGame') { if(sid&&pid) doStartCatchupGame(sid,pid); }
  else if (a==='startNextCatchupGame') { if(gid) doStartNextCatchupGame(gid); }
  else if (a==='addGroup') doAddGroup(sid);
  else if (a==='deleteGroup') doDeleteGroup(id);
  else if (a==='reopenGame') doReopenGame(id);
  else if (a==='randomizeStage') doRandomizeStage(sid);
  else if (a==='autoAssignFromPrev') doAutoAssignFromPrev(sid);
  else if (a==='generateFinals') doGenerateFinals(sid);
  else if (a==='addToGroup') doAddToGroup(gid);
  else if (a==='removeFromGroup') doRemoveFromGroup(gid,pid);
  else if (a==='openScorecard') { S.activeGroupId=gid; S.screen='scorecard'; render(); }
  else if (a==='startGame') doStartGame(gid);
  else if (a==='startGroupGame') { S.activeGroupId = gid; doStartGame(gid); }
  else if (a==='enterGroupScore') { S.activeGroupId = gid; doOpenScoreModal(pid); }
  else if (a==='editRoundScore') { const ri=parseInt(el.dataset.ri); S.activeGroupId = gid; doOpenEditScoreModal(pid, ri); }
  else if (a==='openScoreModal') doOpenScoreModal(pid);
  else if (a==='closeModal') { if (!e.target.closest('.sheet')) upd({scoringModal:null}); }
  else if (a==='toggleNA') doToggleNA(pid);
  else if (a==='saveScore') doSaveScore(pid);
  else if (a==='submitRound') doSubmitRound(gid);
  else if (a==='completeGame') doCompleteGame(gid);
  else if (a==='endGame') doEndGame(gid);
  else if (a==='resetAll') {
    if(confirm('Reset entire tournament data?')) {
      S = { ...DEF, settings:{...DEF.settings}, tournamentId:S.tournamentId,
            tournamentName:S.tournamentName, createdAt:S.createdAt, screen:'home', mode:'admin' };
      save(); render();
    }
  }
  else if (a==='saveRules') {
    const fields = document.querySelectorAll('[data-rules-section]');
    const rules = { ...(S.rules || {}) };
    fields.forEach(f => {
      const section = f.dataset.rulesSection;
      const val = f.value.trim();
      rules[section] = val || DEFAULT_RULES[section];
    });
    upd({ rules });
  }
  else if (a==='resetRules') {
    if (confirm('Reset all rules to default text?')) upd({ rules: {} });
  }
  else if (a==='archiveTournament') {
    const nowArchived = !S.archived;
    upd({ archived: nowArchived });
  }
  else if (a==='deleteTournament') {
    if(confirm('Permanently delete this tournament? This cannot be undone.')) {
      const tid = S.tournamentId;
      pendingSettings = null;
      photoCache = {};
      if (unsubscribeTournament) { unsubscribeTournament(); unsubscribeTournament = null; }
      localStorage.removeItem('nertz2-active');
      S = { ...DEF, settings:{...DEF.settings} };
      render();
      db.collection('tournaments').doc(tid).delete().catch(e => console.error('Delete error:', e));
    }

  else if (a==='openPhotoCrop') openFilePicker(pid);
  else if (a==='cancelPhotoCrop') { cropState = null; render(); }
  else if (a==='applyPhotoCrop') doApplyPhotoCrop();
  else if (a==='chooseNewPhoto') openFilePicker(cropState?.playerId, cropState?.libraryKey);
  else if (a==='submitAdminAuth') doSubmitAdminAuth();
  else if (a==='closeAdminAuth') upd({adminAuthModal:false});
  else if (a==='createTournament') doCreateTournament();
  else if (a==='selectTournament') doSelectTournament(id);
  else if (a==='backToTournamentSelect') {
    pendingSettings = null;
    photoCache = {};
    if (unsubscribeTournament) { unsubscribeTournament(); unsubscribeTournament = null; }
    localStorage.removeItem('nertz2-active');
    S = { ...DEF, settings:{...DEF.settings} };
    render();
  }
}

  }

    const p=S.participants.find(p=>p.id===el.dataset.id);
    if(p){p.collectionId=el.value||null;save();render();}
  }
}

  if (e.key==='Enter') {
    if (e.target.id==='col-name') { e.preventDefault(); doAddCollection(); }
    if (e.target.id==='part-name') { e.preventDefault(); doAddPlayer(); }
    if (e.target.id==='score-inp') { e.preventDefault(); doSaveScore(S.scoringModal?.pid); }
    if (e.target.id==='admin-pw-inp') { e.preventDefault(); doSubmitAdminAuth(); }
    if (e.target.id==='new-tourney-name') { e.preventDefault(); doCreateTournament(); }

function doAddCollection() {
  const name=document.getElementById('col-name')?.value.trim();
  const color=document.getElementById('col-color')?.value||'#4f8ef7';
  if(!name) return;
  S.collections.push({id:uid(),name,color});
  save(); render();
}
function doDeleteCollection(id) {
  S.collections=S.collections.filter(c=>c.id!==id);
  S.participants.forEach(p=>{if(p.collectionId===id)p.collectionId=null;});
  save(); render();
}
function doAddPlayer() {
  const name=document.getElementById('part-name')?.value.trim();
  if(!name) return;
  const col=document.getElementById('part-col')?.value||null;
  const pid=uid();
  S.participants.push({id:pid,name,collectionId:col});
  const key = playerLibraryKey(name);
  const lib = loadLibraryLS();
  lib[key] = { ...lib[key], name, updatedAt: Date.now() };
  saveLibrary(lib);
  // Queue for catch-up in any already-complete stages
  const completedStages = S.stages.filter(st => st.status === 'complete');
  if (completedStages.length > 0) {
    if (!S.catchupQueue) S.catchupQueue = {};
    completedStages.forEach(st => {
      if (!S.catchupQueue[st.id]) S.catchupQueue[st.id] = [];
      if (!S.catchupQueue[st.id].includes(pid)) S.catchupQueue[st.id].push(pid);
    });
  }
  save(); render();
}
function doDeletePlayer(id) {
  S.participants=S.participants.filter(p=>p.id!==id);
  S.groups.forEach(g=>{g.participantIds=g.participantIds.filter(pid=>pid!==id);});
  // Clean up from catch-up queue
  if (S.catchupQueue) {
    Object.keys(S.catchupQueue).forEach(sid => {
      S.catchupQueue[sid] = S.catchupQueue[sid].filter(pid => pid !== id);
    });
  }
  save(); render();
}

function doStartCatchupGame(stageId, pid) {
  const stage = getStage(stageId);
  if (!stage) return;
  const player = getPart(pid);
  if (!player) return;
  // Guard: don't create a second catch-up group if one already exists
  if (S.groups.some(g => g.stageId === stageId && g.isCatchup && g.catchupPlayerId === pid)) return;
  // Find collection members (include eliminated) as opponents
  const collectionId = player.collectionId;
  let opponents = S.participants.filter(p => p.id !== pid && p.collectionId === collectionId);
  if (!opponents.length) {
    // Fall back to any other participant if no collection mates
    opponents = S.participants.filter(p => p.id !== pid);
  }
  const ss = getStageSettings(stageId);
  const gameSize = ss.gameSize || 4;
  // Pick random opponents (up to gameSize-1)
  const shuffled = [...opponents].sort(() => Math.random() - 0.5);
  const chosen = shuffled.slice(0, gameSize - 1);
  const pids = [pid, ...chosen.map(p => p.id)];
  const groupId = uid();
  S.groups.push({ id: groupId, stageId, round: 999, name: `Catch-up ${player.name}`, participantIds: pids, isCatchup: true, catchupPlayerId: pid });
  // Start the game immediately
  S.games.push({ id: uid(), groupId, participantIds: pids, scores: {}, rounds: [], completed: false, startedAt: Date.now() });
  save(); render();
}

function catchupPlayerAdvances(cpid, groupId, stageId, ss) {
  const games = S.games.filter(g => g.groupId === groupId && g.completed);
  const group = getGroup(groupId);
  const pids = group ? group.participantIds : [];
  const method = (ss && ss.advancementMethod) || 'wins';
  const wins = {}, points = {};
  pids.forEach(pid => { wins[pid] = 0; points[pid] = 0; });
  games.forEach(g => {
    // Credit wins: on a tie, all tied players each get 1 win
    const winners = g.winnerId ? [g.winnerId] : gameTiedWinnerIds(g);
    winners.forEach(pid => { wins[pid] = (wins[pid] || 0) + 1; });
    pids.forEach(pid => { points[pid] = (points[pid] || 0) + playerRoundTotal(g, pid); });
  });
  const cpWins = wins[cpid] || 0, cpPts = points[cpid] || 0;
  // Catch-up player advances if no opponent strictly beats them on both primary and secondary metric
  const beatenBy = pids.filter(pid => pid !== cpid && (
    method === 'wins'
      ? (wins[pid] > cpWins || (wins[pid] === cpWins && (points[pid] || 0) > cpPts))
      : ((points[pid] || 0) > cpPts || ((points[pid] || 0) === cpPts && wins[pid] > cpWins))
  ));
  return beatenBy.length === 0; // advances if no one strictly outranks them
}

function doStartNextCatchupGame(groupId) {
  const group = getGroup(groupId);
  if (!group || activeGameForGroup(groupId)) return;
  S.games.push({ id: uid(), groupId, participantIds: group.participantIds, scores: {}, rounds: [], completed: false, startedAt: Date.now() });
  save(); render();
}

function advanceCatchupPlayer(pid, stageId) {
  // Find the next stage after stageId
  const stageIdx = S.stages.findIndex(s => s.id === stageId);
  if (stageIdx < 0) return;
  const nextStage = S.stages[stageIdx + 1];
  if (!nextStage) return; // was the last stage; no advancement
  // Add player to an existing group in the next stage, or create a catch-up group
  const nextGroups = activeGroupsForStage(nextStage.id);
  if (nextGroups.length > 0) {
    // Add to the group with the fewest players (additive, no displacement)
    const target = nextGroups.slice().sort((a, b) => a.participantIds.length - b.participantIds.length)[0];
    if (!target.participantIds.includes(pid)) target.participantIds.push(pid);
  } else {
    // Next stage has no groups yet; create a catch-up placeholder group
    const groupId = uid();
    S.groups.push({ id: groupId, stageId: nextStage.id, round: 1, name: `Catch-up Entry`, participantIds: [pid], isCatchup: true, catchupPlayerId: pid });
  }
  save();
}
function doAddStage() {
  if (S.stages.length > 0) {
    const last = S.stages[S.stages.length - 1];
    if (!stageIsFullyDone(last.id)) {
      alert(`Complete all games in ${last.name} before adding the next stage.`);
      return;
    }
  }
  const num = S.stages.length + 1;
  S.stages.push({ id: uid(), number: num, name: `Stage ${num}`, status: 'active' });
  save(); render();
}
function doDeleteStage(id) {
  if(!confirm('Delete this stage and all its groups?')) return;
  const gids=S.groups.filter(g=>g.stageId===id).map(g=>g.id);
  S.games=S.games.filter(g=>!gids.includes(g.groupId));
  S.groups=S.groups.filter(g=>g.stageId!==id);
  S.stages=S.stages.filter(s=>s.id!==id);
  save(); render();
}
function doSetTotalStages(n) {
  const cur = S.stages.length;
  if (n > cur) {
    for (let i = cur; i < n; i++) {
      S.stages.push({ id: uid(), number: i + 1, name: `Stage ${i + 1}`, status: 'active' });
    }
  } else if (n < cur) {
    // Only remove stages that have no game data
    for (let i = cur - 1; i >= n; i--) {
      const st = S.stages[i];
      const hasData = S.groups.some(g => g.stageId === st.id);
      if (!hasData) {
        S.stages.splice(i, 1);
      } else {
        alert(`Stage ${i + 1} has groups and cannot be removed.`);
        break;
      }
    }
  }
  save(); render();
}
function doAddGroup(stageId) {
  const sid=stageId||S.stages[S.stages.length-1]?.id;
  if(!sid) return;
  const count=S.groups.filter(g=>g.stageId===sid).length;
  S.groups.push({id:uid(),stageId:sid,round:1,name:`Group ${count+1}`,participantIds:[]});
  save(); render();
}
function doDeleteGroup(id) {
  S.games=S.games.filter(g=>g.groupId!==id);
  S.groups=S.groups.filter(g=>g.id!==id);
  save(); render();
}
function getStageAdvancers(stageId) {
  const stageGroups = activeGroupsForStage(stageId);
  const allPids = [...new Set(stageGroups.flatMap(g => g.participantIds))];
  const ss = getStageSettings(stageId);
  const method = ss.advancementMethod;
  const n = ss.advancersPerCollection;
  // Use stage-scoped stats so earlier stages don't inflate rankings
  const stats = stageStats(stageId);

  const byCol = {};
  allPids.forEach(pid => {
    const p = getPart(pid);
    const k = ss.mixCollections ? '__all__' : (p?.collectionId || '__all__');
    (byCol[k] = byCol[k]||[]).push(pid);
  });
  const advancers = [];
  Object.values(byCol).forEach(pids => {
    const ranked = [...pids].sort((a, b) => {
      const sa = stats[a]||{}, sb = stats[b]||{};
      return method === 'wins'
        ? (sb.gamesWon-sa.gamesWon)||(sb.totalPoints-sa.totalPoints)
        : (sb.totalPoints-sa.totalPoints)||(sb.gamesWon-sa.gamesWon);
    });
    const cutoff = Math.min(n, ranked.length);
    const included = ranked.slice(0, cutoff);
    // If there's a next player tied with the last included, pull them in too
    if (cutoff < ranked.length) {
      const lastSt = stats[ranked[cutoff - 1]] || {};
      for (let i = cutoff; i < ranked.length; i++) {
        const nextSt = stats[ranked[i]] || {};
        const tied = method === 'wins'
          ? (lastSt.gamesWon === nextSt.gamesWon && lastSt.totalPoints === nextSt.totalPoints)
          : (lastSt.totalPoints === nextSt.totalPoints && lastSt.gamesWon === nextSt.gamesWon);
        if (tied) included.push(ranked[i]);
        else break;
      }
    }
    advancers.push(...included);
  });
  return advancers;
}

// Returns true if any collection has a tie at the advancement cutoff (for admin warning display).
function hasAdvancerTie(stageId) {
  const stageGroups = activeGroupsForStage(stageId);
  const allPids = [...new Set(stageGroups.flatMap(g => g.participantIds))];
  const ss = getStageSettings(stageId);
  const method = ss.advancementMethod;
  const n = ss.advancersPerCollection;
  const stats = stageStats(stageId);
  const byCol = {};
  allPids.forEach(pid => {
    const p = getPart(pid);
    const k = ss.mixCollections ? '__all__' : (p?.collectionId || '__all__');
    (byCol[k] = byCol[k]||[]).push(pid);
  });
  return Object.values(byCol).some(pids => {
    if (pids.length <= n) return false;
    const ranked = [...pids].sort((a, b) => {
      const sa = stats[a]||{}, sb = stats[b]||{};
      return method === 'wins'
        ? (sb.gamesWon-sa.gamesWon)||(sb.totalPoints-sa.totalPoints)
        : (sb.totalPoints-sa.totalPoints)||(sb.gamesWon-sa.gamesWon);
    });
    const lastIn = stats[ranked[n - 1]] || {};
    const firstOut = stats[ranked[n]] || {};
    return method === 'wins'
      ? (lastIn.gamesWon === firstOut.gamesWon && lastIn.totalPoints === firstOut.totalPoints)
      : (lastIn.totalPoints === firstOut.totalPoints && lastIn.gamesWon === firstOut.gamesWon);
  });
}

function doRandomizeStage(sid) {
  const stage = getStage(sid);
  if (!stage) { alert('Stage not found.'); return; }
  const stageGames = S.games.filter(g => S.groups.some(sg => sg.id === g.groupId && sg.stageId === sid));
  if (stageGames.length > 0) { alert('Cannot re-randomize once scores have been entered.'); return; }
  const ss = getStageSettings(sid);
  const size = ss.gameSize;
  const minSize = ss.minGroupSize || 1;
  const byCol = {};
  S.participants.forEach(p => {
    const k = ss.mixCollections ? '__all__' : (p.collectionId || '__all__');
    (byCol[k] = byCol[k]||[]).push(p.id);
  });
  const newGroups = [];
  let gNum = 1;
  Object.entries(byCol).forEach(([cid, pids]) => {
    const shuffled = [...pids].sort(() => Math.random() - 0.5);
    const col = (!ss.mixCollections && cid !== '__all__') ? getCol(cid) : null;
    const sizes = distributeGroups(shuffled.length, size, minSize);
    let pos = 0;
    sizes.forEach(sz => {
      const chunk = shuffled.slice(pos, pos + sz); pos += sz;
      newGroups.push({ id: uid(), stageId: stage.id, round: 1, name: `Group ${gNum++}${col ? ' ('+col.name+')' : ''}`, participantIds: chunk });
    });
  });
  S.groups = S.groups.filter(g => g.stageId !== stage.id).concat(newGroups);
  save(); render();
}

function doAutoAssignFromPrev(sid) {
  const stageIdx = S.stages.findIndex(s => s.id === sid);
  if (stageIdx <= 0) { alert('No previous stage to pull advancers from.'); return; }
  const prevStageId = S.stages[stageIdx - 1].id;
  if (!stageIsFullyDone(prevStageId)) {
    const prevName = S.stages[stageIdx - 1].name || 'the previous stage';
    if (!confirm(`⚠️ Not all games in ${prevName} are finished yet.\n\nAuto-assigning now will use incomplete standings and may advance the wrong players.\n\nProceed anyway?`)) return;
  }
  const advancers = getStageAdvancers(prevStageId);
  if (advancers.length === 0) { alert('No advancers found from the previous stage.'); return; }
  const ss = getStageSettings(sid);
  const size = ss.gameSize;
  const minSize = ss.minGroupSize || 1;
  const byCol = {};
  advancers.forEach(pid => {
    const p = getPart(pid);
    const k = ss.mixCollections ? '__all__' : (p?.collectionId || '__all__');
    (byCol[k] = byCol[k]||[]).push(pid);
  });
  const newGroups = [];
  let gNum = 1;
  Object.entries(byCol).forEach(([cid, pids]) => {
    const shuffled = [...pids].sort(() => Math.random() - 0.5);
    const col = (!ss.mixCollections && cid !== '__all__') ? getCol(cid) : null;
    const sizes = distributeGroups(shuffled.length, size, minSize);
    let pos = 0;
    sizes.forEach(sz => {
      const chunk = shuffled.slice(pos, pos + sz); pos += sz;
      newGroups.push({ id: uid(), stageId: sid, round: 1, name: `Group ${gNum++}${col ? ' ('+col.name+')' : ''}`, participantIds: chunk });
    });
  });
  S.groups = S.groups.filter(g => g.stageId !== sid).concat(newGroups);
  save(); render();
}

function doGenerateFinals(sid) {
  const stageIdx = S.stages.findIndex(s => s.id === sid);
  if (stageIdx <= 0) { alert('No previous stage to pull winners from.'); return; }
  const prevStageId = S.stages[stageIdx - 1].id;
  if (!stageIsFullyDone(prevStageId)) {
    const prevName = S.stages[stageIdx - 1].name || 'the previous stage';
    if (!confirm(`⚠️ Not all games in ${prevName} are finished yet.\n\nGenerating finals now will use incomplete standings and may select the wrong players.\n\nProceed anyway?`)) return;
  }
  const advancers = getStageAdvancers(prevStageId);
  if (advancers.length === 0) { alert('No advancers found from the previous stage.'); return; }
  // Use the previous stage's scoped stats and its own advancementMethod (not the global setting)
  const stats = stageStats(prevStageId);
  const prevSS = getStageSettings(prevStageId);
  const method = prevSS.advancementMethod;
  // Take top 1 per collection among the advancers
  const byCol = {};
  advancers.forEach(pid => {
    const p = getPart(pid);
    const k = p?.collectionId || '__all__';
    (byCol[k] = byCol[k]||[]).push(pid);
  });
  const finalists = [];
  Object.entries(byCol).forEach(([, pids]) => {
    const ranked = [...pids].sort((a, b) => {
      const sa = stats[a]||{}, sb = stats[b]||{};
      return method === 'wins'
        ? (sb.gamesWon-sa.gamesWon)||(sb.totalPoints-sa.totalPoints)
        : (sb.totalPoints-sa.totalPoints)||(sb.gamesWon-sa.gamesWon);
    });
    // Include the top player and all players tied with them
    const topSt = stats[ranked[0]] || {};
    finalists.push(ranked[0]);
    for (let i = 1; i < ranked.length; i++) {
      const st = stats[ranked[i]] || {};
      const tied = method === 'wins'
        ? (topSt.gamesWon === st.gamesWon && topSt.totalPoints === st.totalPoints)
        : (topSt.totalPoints === st.totalPoints && topSt.gamesWon === st.gamesWon);
      if (tied) finalists.push(ranked[i]);
      else break;
    }
  });
  const ssF = getStageSettings(sid);
  const newGroups = [];
  // All finalists play together in one group — ignore max group size for the final stage
  newGroups.push({ id: uid(), stageId: sid, round: 1, name: 'Finals', participantIds: finalists });
  S.groups = S.groups.filter(g => g.stageId !== sid).concat(newGroups);
  save(); render();
}
function doAddToGroup(gid) {
  const sel=document.getElementById('atg-'+gid);
  const pid=sel?.value; if(!pid) return;
  const g=S.groups.find(g=>g.id===gid);
  if(g&&!g.participantIds.includes(pid)){g.participantIds.push(pid);save();render();}

function doRemoveFromGroup(gid,pid) {
  const g=S.groups.find(g=>g.id===gid);
  if(g){g.participantIds=g.participantIds.filter(id=>id!==pid);save();render();}
}
function doStartGame(gid) {
  const group=getGroup(gid);
  if(!group||group.participantIds.length<2){alert('Group needs at least 2 players.');return;}
  const existing=activeGameForGroup(gid);
  if(existing){render();return;}
  S.games.push({id:uid(),groupId:gid,stageId:group.stageId,participantIds:[...group.participantIds],rounds:[],completed:false,winnerId:null,startTime:Date.now()});

}
function doOpenScoreModal(pid) {
  upd({scoringModal:{pid}});
  setTimeout(()=>{

}
function doOpenEditScoreModal(pid, roundIdx) {
  const game = activeGameForGroup(S.activeGroupId);
  if (!game) return;
  const gid = game.id;
  const existing = game.rounds[roundIdx]?.[pid];
  // Pre-seed roundInputs for this game so the N/A toggle has a starting state
  const seed = existing === 'NA' ? 'NA' : (existing !== undefined ? existing : '');
  upd({scoringModal:{pid, editRound: roundIdx}, roundInputs:{...S.roundInputs, [gid]: {...(S.roundInputs[gid]||{}), [pid]: seed}}});
  setTimeout(()=>{
    const inp=document.getElementById('score-inp');
    if(inp){inp.focus();inp.select();}
  },50);
}
function doToggleNA(pid) {
  const gid = activeGameForGroup(S.activeGroupId)?.id;
  if (!gid) return;
  const cur = (S.roundInputs[gid]||{})[pid];
  const slot = {...(S.roundInputs[gid]||{})};
  if (cur === 'NA') { delete slot[pid]; } else { slot[pid] = 'NA'; }
  upd({roundInputs:{...S.roundInputs, [gid]: slot}});
}
function doSaveScore(pid) {
  if (!pid) return;
  const editRound = S.scoringModal?.editRound;
  const game = activeGameForGroup(S.activeGroupId);
  const gid = game?.id;

  if (editRound !== undefined) {
    if (!game || !game.rounds[editRound]) { upd({scoringModal:null}); return; }
    const isNA = (S.roundInputs[gid]||{})[pid] === 'NA';
    const inp = document.getElementById('score-inp');
    const val = inp ? inp.value.trim() : '';
    if (!isNA && val === '') { alert('Enter a score or mark N/A.'); return; }
    const newVal = isNA ? 'NA' : (parseInt(val) || 0);
    game.rounds[editRound][pid] = newVal;
    upd({scoringModal: null});
    // Transactionally persist the edited round value
    mutateGameTx(gid, g => { if (g.rounds[editRound]) g.rounds[editRound][pid] = newVal; });
    return;
  }

  if (!gid) return;
  const isNA = (S.roundInputs[gid]||{})[pid] === 'NA';
  if (isNA) { upd({scoringModal: null}); return; }
  const inp = document.getElementById('score-inp');
  const val = inp ? inp.value.trim() : '';
  if (val === '') { alert('Enter a score or mark N/A.'); return; }
  upd({roundInputs:{...S.roundInputs, [gid]: {...(S.roundInputs[gid]||{}), [pid]: parseInt(val)||0}}, scoringModal:null});
}
// Atomically mutate one game in Firestore using a transaction (read-latest → apply → write).
// Prevents lost updates when multiple devices save concurrently.
async function mutateGameTx(gameId, fn) {
  if (!S.tournamentId) return;
  const ref = db.collection('tournaments').doc(S.tournamentId);
  await db.runTransaction(async tx => {
    const doc = await tx.get(ref);
    if (!doc.exists) return;
    const games = JSON.parse(JSON.stringify(doc.data().games || []));
    const g = games.find(g => g.id === gameId);
    if (!g) return;
    fn(g);
    tx.update(ref, { games });
  }).catch(e => console.error('mutateGameTx error:', e));
}

function doSubmitRound(gameid) {
  const game = getGame(gameid);
  if (!game) return;
  const inputs = S.roundInputs[gameid] || {};
  const round = {};
  game.participantIds.forEach(pid => {
    const v = inputs[pid];
    round[pid] = v === 'NA' ? 'NA' : (Number(v) || 0);
  });
  // Optimistic local update for instant UI feedback
  game.rounds.push(round);
  const newInputs = {...S.roundInputs};
  delete newInputs[gameid];
  S.roundInputs = newInputs;
  render();
  // Transactional Firestore write — reads latest, pushes round, writes back (no lost updates)
  mutateGameTx(gameid, g => { g.rounds.push(round); });
}
// Create next-round groups + auto-started games for one collection's worth of sourceGroups.
// colKey is used for the deduplication guard and group naming.
function addNextRoundGroupsForCollection(stageId, nextRound, colKey, sourceGroups) {
  const ss = getStageSettings(stageId);
  // Guard: don't create duplicate rounds for this collection
  const alreadyExists = S.groups.some(g =>
    g.stageId === stageId && (g.round || 1) === nextRound && !g.isCatchup &&
    groupColKey(g, ss) === colKey
  );
  if (alreadyExists) return;
  const allPids = sourceGroups.flatMap(g => g.participantIds);
  const size = ss.gameSize;
  const minSize = ss.minGroupSize || 1;
  const col = (colKey !== '__all__') ? getCol(colKey) : null;
  const shuffled = [...allPids].sort(() => Math.random() - 0.5);
  const sizes = distributeGroups(shuffled.length, size, minSize);
  const newGroups = [];
  // Start group numbering after any same-round groups already added this tick
  let gNum = S.groups.filter(g => g.stageId === stageId && (g.round || 1) === nextRound && !g.isCatchup).length + 1;
  let pos = 0;
  sizes.forEach(sz => {
    const chunk = shuffled.slice(pos, pos + sz); pos += sz;
    newGroups.push({ id: uid(), stageId, round: nextRound, name: `Group ${gNum++}${col ? ' ('+col.name+')' : ''}`, participantIds: chunk });
  });
  S.groups = [...S.groups, ...newGroups];
  // Auto-start a game for each new group so players see their scorecard immediately
  newGroups.forEach(g => {
    S.games.push({ id: uid(), groupId: g.id, stageId, participantIds: [...g.participantIds], rounds: [], completed: false, winnerId: null, startTime: Date.now() });
  });
}

// Check all active stages and, per collection, create the next shuffle-round groups+games
// whenever all current-round groups for that collection are done. Safe to call repeatedly.
function checkAndTriggerShuffles() {
  let changed = false;
  S.stages.forEach(stage => {
    if (stage.status === 'complete') return;
    const ss = getStageSettings(stage.id);
    if (!ss.shuffleAfterGame) return;
    const gamesPerStage = ss.gamesPerStage || 1;
    if (gamesPerStage <= 1) return;
    const stageGroups = S.groups.filter(g => g.stageId === stage.id && !g.isCatchup);
    if (!stageGroups.length) return;
    // Group by collection — each collection shuffles independently
    const byCol = {};
    stageGroups.forEach(g => {
      const k = groupColKey(g, ss);
      if (!byCol[k]) byCol[k] = [];
      byCol[k].push(g);
    });
    Object.entries(byCol).forEach(([colKey, colGroups]) => {
      const maxRound = Math.max(...colGroups.map(g => g.round || 1));
      if (maxRound >= gamesPerStage) return; // Collection finished all rounds
      const currentRoundGroups = colGroups.filter(g => (g.round || 1) === maxRound);
      const allDone = currentRoundGroups.every(g => completedGamesForGroup(g.id).length > 0);
      if (!allDone) return;
      const before = S.groups.length + S.games.length;
      addNextRoundGroupsForCollection(stage.id, maxRound + 1, colKey, currentRoundGroups);
      if (S.groups.length + S.games.length > before) changed = true;
    });
  });
  if (changed) save();
}

function doCompleteGame(gameid) {
  const game=getGame(gameid);
  if(!game) return;
  const winnerId = gameWinnerId(game);
  game.winnerId = winnerId;
  game.completed = true;

  // Clear only this game's inputs (leave other games' in-progress inputs intact)
  const newInputs = {...S.roundInputs};
  delete newInputs[gameid];
  S.roundInputs = newInputs;

  const group = getGroup(game.groupId);
  if (group && group.isCatchup && group.catchupPlayerId) {
    // Catch-up game completion — needs full save for catchupQueue and advancement
    const cpid = group.catchupPlayerId;
    const stageId = group.stageId;
    const ss = getStageSettings(stageId);
    const gamesPerStage = ss.gamesPerStage || 1;
    const allDoneGames = S.games.filter(g => g.groupId === game.groupId && g.completed);
    if (allDoneGames.length >= gamesPerStage) {
      if (S.catchupQueue && S.catchupQueue[stageId]) {
        S.catchupQueue[stageId] = S.catchupQueue[stageId].filter(pid => pid !== cpid);
      }
      if (catchupPlayerAdvances(cpid, game.groupId, stageId, ss)) {
        advanceCatchupPlayer(cpid, stageId);
      }
    }
    save(); render();
  } else {
    // Normal game completion — use transaction so we only update 'games', not 'groups'.
    // This prevents overwriting round-2 groups that another device may have just created.
    render();
    mutateGameTx(gameid, g => { g.completed = true; g.winnerId = winnerId; });
    // checkAndTriggerShuffles runs via onSnapshot setTimeout after the transaction lands.
  }
}
function doEndGame(gameid) {
  if(!confirm('End this game early? The player with the most points wins.')) return;
  doCompleteGame(gameid);
}
function doReopenGame(gameid) {
  if(!confirm('Reopen this game for score editing? It will become active again.')) return;
  const game=getGame(gameid);
  if(!game) return;
  game.completed=false;
  game.winnerId=null;
  save(); render();
}

  const docRef = db.collection('tournaments').doc();
  const id = docRef.id;

  const newData = {
    tournamentId: id, tournamentName: name, createdAt: now,
    settings: { ...DEF.settings }, collections: [], participants: [], stages: [], groups: [], games: [],
  };
  S = { ...DEF, ...newData, screen: 'home', mode: 'admin', pickerCreating: false };
  render();
  try {
    await docRef.set(newData);
    subscribeToTournament(id);
  } catch(e) { alert('Failed to create tournament. Check connection.'); }
}
