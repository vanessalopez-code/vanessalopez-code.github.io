<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Nertz — Vanessa's 40th</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,700&family=Special+Elite&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <style>
    :root {
      --bg: #ece4f4;
      --surface: #f7f2fc;
      --surface2: #e2d6ef;
      --border: #c9b5de;
      --text: #2b1040;
      --muted: #9880b5;
      --accent: #c0187e;
      --gold: #9480c4;
      --green: #2e7d4f;
      --red: #8b0058;
      --sb: env(safe-area-inset-bottom, 0px);
      --st: env(safe-area-inset-top, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overscroll-behavior: none; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.4; }
    h1, h2, .hdr-logo, .home-hero h1 { font-family: 'Playfair Display', Georgia, serif; }

    #app { max-width: 480px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }

    /* HEADER */
    .hdr { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 16px; padding-top: var(--st); position: sticky; top: 0; z-index: 100; }
    .hdr-inner { display: flex; align-items: center; height: 52px; gap: 10px; }
    .hdr-back { width: 40px; height: 40px; border: none; background: none; color: var(--accent); font-size: 22px; cursor: pointer; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .hdr-title { flex: 1; font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hdr-logo { font-size: 15px; font-weight: 800; color: var(--gold); flex: 1; }
    .mode-pill { display: flex; background: var(--bg); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; flex-shrink: 0; }
    .mode-btn { padding: 5px 12px; font-size: 12px; font-weight: 600; border: none; background: none; color: var(--muted); cursor: pointer; transition: all 0.15s; }
    .mode-btn.active { background: var(--accent); color: #fff; }

    /* MAIN */
    .main { flex: 1; overflow-y: auto; padding-bottom: calc(64px + var(--sb)); }
    .main.no-nav { padding-bottom: 0; }

    /* BOTTOM NAV */
    .bnav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: var(--surface); border-top: 1px solid var(--border); display: flex; padding-bottom: var(--sb); z-index: 100; }
    .bnav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px 0; gap: 3px; font-size: 10px; font-weight: 600; color: var(--muted); cursor: pointer; border: none; background: none; transition: color 0.15s; }
    .bnav-item.active { color: var(--gold); }
    .bnav-icon { font-size: 22px; line-height: 1; }

    /* HOME SCREEN */
    .home { padding: 16px; display: flex; flex-direction: column; gap: 12px; }

    /* Hero — styled like the party playing card */
    .home-hero-card { background: #fdfaf8; border: 3px solid var(--accent); border-radius: 22px; padding: 28px 20px 24px; position: relative; text-align: center; }
    .home-hero-card::before { content: ''; position: absolute; inset: 8px; border: 1.5px dashed var(--accent); border-radius: 15px; pointer-events: none; }
    .home-hero-eyebrow { font-family: 'Special Elite', monospace; font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent); line-height: 1.6; }
    .home-hero-title { font-family: 'Playfair Display', Georgia, serif; font-size: 38px; font-weight: 800; font-style: italic; color: var(--accent); margin: 4px 0; line-height: 1.1; }
    .home-hero-suits { font-size: 28px; color: var(--accent); letter-spacing: 6px; margin: 8px 0 4px; }
    .home-party-label { font-family: 'Special Elite', monospace; font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--muted); margin-top: 10px; }
    .home-stat-pill { display: inline-block; background: var(--bg); border: 1px solid var(--border); border-radius: 20px; padding: 4px 14px; font-family: 'Special Elite', monospace; font-size: 11px; letter-spacing: 0.06em; color: var(--muted); margin-top: 8px; }

    /* Option cards */
    .home-card { background: #fdfaf8; border: 2px solid var(--accent); border-radius: 16px; padding: 18px 16px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: all 0.12s; }
    .home-card:active { background: var(--surface2); transform: scale(0.98); }
    .home-card-icon { font-size: 30px; flex-shrink: 0; }
    .home-card-body { flex: 1; }
    .home-card-body h2 { font-family: 'Special Elite', monospace; font-size: 16px; letter-spacing: 0.04em; color: var(--accent); }
    .home-card-body p { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .home-card-arrow { color: var(--accent); font-size: 20px; font-weight: 300; }

    /* SECTION */
    .section { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
    .section-title { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; }

    /* CARDS */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
    .card-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; }
    .card-title { font-size: 15px; font-weight: 700; }
    .card-body { padding: 0 16px 14px; }
    .card-row { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--border); }

    /* CHIPS */
    .chip { display: inline-flex; align-items: center; gap: 4px; background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 4px 10px; font-size: 13px; }
    .chip-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }

    /* BADGES */
    .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 700; border: 1px solid; }
    .badge-green { color: var(--green); border-color: var(--green); background: rgba(63,185,80,.1); }
    .badge-gold { color: var(--gold); border-color: var(--gold); background: rgba(148,128,196,.1); }
    .badge-muted { color: var(--muted); border-color: var(--border); background: var(--surface2); }
    .badge-blue { color: var(--accent); border-color: var(--accent); background: rgba(192,24,126,.1); }

    /* BUTTONS */
    .btn { display: flex; align-items: center; justify-content: center; gap: 6px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; padding: 13px 20px; transition: opacity 0.12s; }
    .btn:active { opacity: 0.75; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-gold { background: var(--gold); color: #fff; }
    .btn-danger { background: var(--red); color: #fff; }
    .btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-sm { padding: 8px 14px; font-size: 13px; border-radius: 8px; }
    .btn-xs { padding: 5px 10px; font-size: 12px; border-radius: 6px; }
    .btn-full { width: 100%; }
    .btn-row { display: flex; gap: 8px; }
    .btn-icon { background: none; border: none; color: var(--muted); cursor: pointer; padding: 6px; border-radius: 6px; font-size: 18px; line-height: 1; }
    .btn-icon:active { color: var(--text); background: var(--surface2); }
    .btn-icon.red:active { color: var(--red); }

    /* FORMS */
    .field { display: flex; flex-direction: column; gap: 6px; }
    .label { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .input { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; color: var(--text); padding: 13px 14px; font-size: 16px; width: 100%; outline: none; }
    .input:focus { border-color: var(--accent); }
    .input-sm { padding: 8px 10px; font-size: 14px; border-radius: 8px; }
    select.input { cursor: pointer; }
    input[type="color"] { width: 44px; height: 44px; padding: 4px; border-radius: 8px; cursor: pointer; }
    .seg { display: flex; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .seg-btn { flex: 1; padding: 10px 8px; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.12s; }
    .seg-btn.active { background: var(--accent); color: #fff; }

    /* LIST ROWS */
    .list-row { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--border); }
    .list-row:first-child { border-top: none; }
    .list-row-label { flex: 1; font-size: 15px; }
    .list-row-sub { font-size: 12px; color: var(--muted); }

    /* BRACKET */
    .stage-block { display: flex; flex-direction: column; gap: 10px; }
    .stage-label { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.8px; color: var(--gold); padding: 0 16px; }
    .bracket-group { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; margin: 0 16px; overflow: hidden; }
    .bracket-group-hdr { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
    .bracket-group-name { font-size: 14px; font-weight: 700; flex: 1; }
    .bracket-players { display: flex; flex-direction: column; }
    .bracket-player { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--border); }
    .bracket-player:first-child { border-top: none; }
    .bracket-player.winner { background: rgba(148,128,196,0.06); }
    .bracket-avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--surface2); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; color: var(--muted); }
    .bracket-avatar.winner-av { background: rgba(148,128,196,0.15); border-color: var(--gold); color: var(--gold); }
    .bracket-pname { flex: 1; font-size: 14px; }
    .bracket-pname.winner { font-weight: 700; color: var(--gold); }

    /* LEADERBOARD */
    .lb-filters { display: flex; gap: 8px; padding: 0 16px; }
    .lb-filter { padding: 7px 14px; background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap; }
    .lb-filter.active { border-color: var(--accent); color: var(--accent); background: rgba(192,24,126,.1); }
    .lb-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--border); }
    .lb-rank { width: 28px; font-size: 14px; font-weight: 800; color: var(--muted); text-align: center; flex-shrink: 0; }
    .lb-avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--surface2); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
    .lb-name { flex: 1; font-size: 15px; font-weight: 600; }
    .lb-stat { text-align: right; }
    .lb-stat-val { font-size: 16px; font-weight: 700; }
    .lb-stat-sub { font-size: 11px; color: var(--muted); }

    /* SCORES - GROUP LIST */
    .group-list-item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; transition: background 0.1s; }
    .group-list-item:active { background: var(--surface2); }
    .group-list-item + .group-list-item { border-top: 1px solid var(--border); }
    .group-avatar { width: 44px; height: 44px; border-radius: 12px; background: var(--surface2); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .group-info { flex: 1; }
    .group-info-name { font-size: 15px; font-weight: 700; }
    .group-info-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

    /* SCORECARD */
    .sc-players { display: flex; gap: 8px; padding: 16px; overflow-x: auto; }
    .sc-player-tile { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
    .sc-player-tile:active .sc-avatar { transform: scale(0.94); }
    .sc-avatar { width: 56px; height: 56px; border-radius: 50%; background: var(--surface2); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; transition: all 0.12s; position: relative; }
    .sc-avatar.has-score { border-color: var(--green); background: rgba(63,185,80,.1); }
    .sc-avatar.is-na { border-color: var(--muted); opacity: 0.5; }
    .sc-avatar.is-winner { border-color: var(--gold); background: rgba(148,128,196,.12); }
    .sc-avatar-check { position: absolute; bottom: -2px; right: -2px; width: 18px; height: 18px; border-radius: 50%; background: var(--green); color: #fff; font-size: 10px; display: flex; align-items: center; justify-content: center; border: 2px solid var(--bg); }
    .sc-pname { font-size: 11px; color: var(--muted); font-weight: 600; text-align: center; max-width: 60px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sc-pscore { font-size: 13px; font-weight: 700; }

    .sc-round-info { padding: 0 16px 8px; display: flex; align-items: center; justify-content: space-between; }
    .sc-round-label { font-size: 20px; font-weight: 800; }
    .sc-target { font-size: 13px; color: var(--muted); }

    .sc-progress { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 6px; }
    .sc-progress-row { display: flex; align-items: center; gap: 10px; }
    .sc-progress-name { font-size: 13px; color: var(--muted); width: 80px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sc-progress-bar-wrap { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .sc-progress-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.3s; }
    .sc-progress-fill.hit { background: var(--gold); }
    .sc-progress-pts { font-size: 13px; font-weight: 700; min-width: 36px; text-align: right; }

    .sc-history { border-top: 1px solid var(--border); margin-top: 8px; }
    .sc-history-title { padding: 10px 16px; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .sc-table-wrap { overflow-x: auto; padding: 0 16px 16px; }
    .sc-table { border-collapse: collapse; font-size: 13px; width: 100%; min-width: 200px; }
    .sc-table th { padding: 6px 10px; background: var(--surface2); border: 1px solid var(--border); font-weight: 700; text-align: center; font-size: 11px; }
    .sc-table td { padding: 6px 10px; border: 1px solid var(--border); text-align: center; }
    .sc-table .round-col { color: var(--muted); font-size: 11px; font-weight: 700; }
    .sc-table .pos { color: var(--green); }
    .sc-table .neg { color: var(--red); }
    .sc-table .na-cell { color: var(--muted); font-style: italic; }
    .sc-table .total-row td { background: var(--surface2); font-weight: 700; border-top: 2px solid var(--border); }
    .sc-table .winner-col { background: rgba(148,128,196,.08); }

    .sc-actions { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .sc-winner-banner { background: rgba(148,128,196,.12); border: 1px solid rgba(148,128,196,.3); border-radius: 12px; padding: 14px 16px; text-align: center; font-weight: 700; color: var(--gold); font-size: 16px; }

    /* SCORE MODAL */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 300; display: flex; align-items: flex-end; }
    .sheet { background: var(--surface); border-radius: 24px 24px 0 0; padding: 8px 20px calc(20px + var(--sb)); width: 100%; max-height: 90vh; overflow-y: auto; }
    .sheet-handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 10px auto 20px; }
    .sheet-player { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 20px; }
    .sheet-avatar { width: 72px; height: 72px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 24px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
    .sheet-name { font-size: 20px; font-weight: 700; }
    .sheet-total { font-size: 13px; color: var(--muted); }
    .score-input-xl { font-size: 40px; font-weight: 800; text-align: center; background: var(--surface2); border: 2px solid var(--border); border-radius: 14px; color: var(--text); padding: 18px; width: 100%; outline: none; -moz-appearance: textfield; }
    .score-input-xl::-webkit-inner-spin-button, .score-input-xl::-webkit-outer-spin-button { -webkit-appearance: none; }
    .score-input-xl:focus { border-color: var(--accent); }
    .na-toggle { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; font-size: 15px; font-weight: 600; color: var(--muted); margin: 12px 0; }
    .na-toggle.active { border-color: var(--gold); color: var(--gold); background: rgba(148,128,196,.08); }

    /* ADMIN */
    .admin-tabs { display: flex; overflow-x: auto; gap: 0; border-bottom: 1px solid var(--border); }
    .admin-tab { padding: 14px 18px; background: none; border: none; border-bottom: 2px solid transparent; color: var(--muted); cursor: pointer; font-size: 13px; font-weight: 700; white-space: nowrap; margin-bottom: -1px; }
    .admin-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* STAGE FILTER */
    .stage-filter { display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; }
    .sf-btn { padding: 6px 14px; background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap; }
    .sf-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(148,128,196,.08); }

    /* EMPTY */
    .empty { text-align: center; padding: 48px 24px; color: var(--muted); }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .empty p { font-size: 15px; max-width: 240px; margin: 0 auto; line-height: 1.5; }

    /* UTILS */
    .hidden { display: none !important; }
    .divider { height: 1px; background: var(--border); margin: 4px 0; }
    .pos { color: var(--green); }
    .neg { color: var(--red); }
    .text-muted { color: var(--muted); }
    .text-gold { color: var(--gold); }
    .fw7 { font-weight: 700; }
    .mt8 { margin-top: 8px; }
    .gap8 { gap: 8px; }

    /* ── PARTY AESTHETIC OVERRIDES ── */
    /* Cream playing-card surfaces */
    .card, .bracket-group { background: #fdfaf8; border-color: #d8c0e8; }
    /* Crimson-tinted header */
    .hdr { background: #fdfaf8; border-bottom: 2px solid var(--accent); }
    .hdr-logo { font-family: 'Special Elite', monospace; font-size: 16px; color: var(--accent); letter-spacing: 0.06em; }
    .hdr-title { font-family: 'Special Elite', monospace; letter-spacing: 0.04em; color: var(--accent); }
    /* Bottom nav */
    .bnav { background: #fdfaf8; border-top: 2px solid var(--accent); }
    .bnav-item { font-family: 'Special Elite', monospace; font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; }
    .bnav-item.active { color: var(--accent); }
    /* Section + field labels use Special Elite */
    .section-title, .label, .stage-label { font-family: 'Special Elite', monospace; letter-spacing: 0.1em; }
    /* Admin tabs */
    .admin-tab { font-family: 'Special Elite', monospace; letter-spacing: 0.06em; }
    .admin-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    /* Stage filter + leaderboard filter */
    .sf-btn, .lb-filter { font-family: 'Special Elite', monospace; letter-spacing: 0.04em; }
    .sf-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(192,24,126,.06); }
    /* Mode pill */
    .mode-btn { font-family: 'Special Elite', monospace; font-size: 11px; letter-spacing: 0.04em; }
    /* Sheet (score modal) */
    .sheet { background: #fdfaf8; border-top: 3px solid var(--accent); }
    .sheet-handle { background: var(--accent); opacity: 0.3; }
    .sheet-name { font-family: 'Special Elite', monospace; letter-spacing: 0.06em; }
    /* Buttons — primary stays solid crimson; ghost gets crimson border */
    .btn-ghost { border-color: var(--accent); color: var(--accent); background: transparent; }
    .btn-ghost:active { background: rgba(192,24,126,.06); }
    /* Score input */
    .score-input-xl { background: var(--bg); border-color: var(--border); }
    .score-input-xl:focus { border-color: var(--accent); }
    /* Chips */
    .chip { background: #fdfaf8; border-color: #d8c0e8; }
    /* Bracket stage label */
    .stage-label { color: var(--accent); }
    /* Winner banner */
    .sc-winner-banner { border-color: rgba(148,128,196,.4); color: var(--gold); background: rgba(148,128,196,.1); }
    /* Progress bar */
    .sc-progress-fill { background: var(--accent); }
    .sc-progress-fill.hit { background: var(--gold); }
  </style>
</head>

<div id="app"></div>
<script>
// =========================================================
// FIREBASE
// =========================================================
firebase.initializeApp({
  apiKey: "AIzaSyDXRB0VzKtzVXFobJsI_EIPFMEMomvGiJs",
  authDomain: "nertz-tournament.firebaseapp.com",
  projectId: "nertz-tournament",
  storageBucket: "nertz-tournament.firebasestorage.app",
  messagingSenderId: "667105542784",
  appId: "1:667105542784:web:6655561d7ae10f19eb5c65"
});
const db = firebase.firestore();

// =========================================================
// STATE
// =========================================================
const DEF = {
  mode: 'player',
  screen: 'picker',

function initials(name) {
  if (!name) return '?';
  return name.trim().split(/\s+/).map(w=>w[0]).join('').toUpperCase().slice(0,2);
}
function escH(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function getPart(id) { return S.participants.find(p=>p.id===id); }
function getCol(id) { return S.collections.find(c=>c.id===id); }
function getGroup(id) { return S.groups.find(g=>g.id===id); }
function getGame(id) { return S.games.find(g=>g.id===id); }
function getStage(id) { return S.stages.find(s=>s.id===id); }

function activeGameForGroup(gid) {
  return S.games.find(g=>g.groupId===gid && !g.completed);
}
function completedGamesForGroup(gid) {
  return S.games.filter(g=>g.groupId===gid && g.completed);
}

function cumulative(game) {
  const res = {};
  game.participantIds.forEach(pid => { res[pid] = []; });
  game.rounds.forEach((round, i) => {
    game.participantIds.forEach(pid => {
      const prev = i > 0 ? res[pid][i-1] : 0;
      const v = round[pid];
      res[pid].push(prev + (v === 'NA' || v === undefined ? 0 : (Number(v)||0)));
    });
  });
  return res;
}

function playerRoundTotal(game, pid) {
  return game.rounds.reduce((s,r) => {
    const v = r[pid];
    return s + (v === 'NA' || v === undefined ? 0 : (Number(v)||0));
  }, 0);
}

function gameWinnerId(game) {
  const cum = cumulative(game);
  let max = -Infinity, winner = null;
  game.participantIds.forEach(pid => {
    const sc = cum[pid]||[];
    const total = sc.length ? sc[sc.length-1] : 0;
    if (total > max) { max = total; winner = pid; }
  });
  return winner;
}

function gameIsOver(game) {
  const ss = game.stageId ? getStageSettings(game.stageId) : S.settings;
  const target = ss.pointsToWin;
  const cum = cumulative(game);
  return game.participantIds.some(pid => {
    const sc = cum[pid]||[];
    return sc.length > 0 && sc[sc.length-1] >= target;
  });
}

function allStats() {
  const stats = {};
  S.participants.forEach(p => { stats[p.id] = {totalPoints:0, gamesWon:0, gamesPlayed:0}; });
  S.games.filter(g=>g.completed).forEach(game => {
    game.participantIds.forEach(pid => {
      if (!stats[pid]) stats[pid] = {totalPoints:0, gamesWon:0, gamesPlayed:0};
      stats[pid].gamesPlayed++;
      stats[pid].totalPoints += playerRoundTotal(game, pid);
      if (game.winnerId === pid) stats[pid].gamesWon++;
    });
  });
  return stats;
}

function unassigned(stageId) {
  const assigned = new Set(S.groups.filter(g=>g.stageId===stageId).flatMap(g=>g.participantIds));
  return S.participants.filter(p=>!assigned.has(p.id));
}

function colorsForParticipant(pid) {
  const p = getPart(pid);
  if (!p || !p.collectionId) return null;
  return getCol(p.collectionId);
}

// Distribute `total` players into groups of at most `maxSize`, never smaller than `minSize`.
// When there's a leftover smaller than minSize, borrow players from full groups
// so the last group reaches minSize (reducing some full groups to maxSize-1).
function distributeGroups(total, maxSize, minSize) {
  const mn = Math.min(minSize, maxSize);
  if (total === 0) return [];
  if (total <= maxSize) return [total];
  const numFull = Math.floor(total / maxSize);
  const remainder = total % maxSize;
  if (remainder === 0) return Array(numFull).fill(maxSize);
  if (remainder >= mn) return [...Array(numFull).fill(maxSize), remainder];
  // Remainder too small — borrow from full groups
  const deficit = mn - remainder;
  if (deficit <= numFull && maxSize - 1 >= mn) {
    const sizes = Array(numFull).fill(maxSize);
    for (let i = 0; i < deficit; i++) sizes[i]--;
    return [...sizes, remainder + deficit];
  }
  // Fallback: simple chunking (edge case — constraints can't be satisfied)
  const sizes = [];
  for (let i = 0; i < total; i += maxSize) sizes.push(Math.min(maxSize, total - i));
  return sizes;
}

// Returns the effective settings for a stage, falling back to global settings.
function getStageSettings(stageId) {
  const stage = getStage(stageId);
  const ss = stage?.settings || {};
  const gs = S.settings;
  return {
    gameSize:              ss.gameSize              ?? gs.gameSize,
    minGroupSize:          ss.minGroupSize          ?? gs.minGroupSize,
    gamesPerStage:         ss.gamesPerStage         ?? gs.gamesPerStage,
    pointsToWin:           ss.pointsToWin           ?? gs.pointsToWin,
    shuffleAfterGame:      ss.shuffleAfterGame      ?? gs.shuffleAfterGame,
    advancementMethod:     ss.advancementMethod     ?? gs.advancementMethod,
    advancersPerCollection: ss.advancersPerCollection ?? gs.advancersPerCollection ?? gs.advancersPerGroup ?? 1,
    mixCollections:        ss.mixCollections        ?? false,
    isFinal:               ss.isFinal              ?? false,
  };
}

// Returns groups in a stage that belong to the current (highest) round.
function activeGroupsForStage(stageId) {
  const groups = S.groups.filter(g => g.stageId === stageId);
  if (!groups.length) return [];
  const maxRound = Math.max(...groups.map(g => g.round || 1));
  return groups.filter(g => (g.round || 1) === maxRound);
}

function stageCurrentRound(stageId) {
  const groups = S.groups.filter(g => g.stageId === stageId);
  if (!groups.length) return 1;
  return Math.max(...groups.map(g => g.round || 1));
}

// Status of a single group: 'pending' | 'active' | 'final'
function groupStatus(groupId, stageId) {
  const active = activeGameForGroup(groupId);
  if (active) return 'active';
  const done = completedGamesForGroup(groupId);
  if (!done.length) return 'pending';
  const ss = getStageSettings(stageId);
  const gps = ss.gamesPerStage || 1;
  return done.length >= gps ? 'final' : 'active';
}

// True when every active group in the stage has completed all required games.
function stageIsFullyDone(stageId) {
  const groups = activeGroupsForStage(stageId);
  if (!groups.length) return false;
  return groups.every(g => groupStatus(g.id, stageId) === 'final');
}

// Returns how many complete game cycles have finished in a stage.
// Shuffle mode: counts completed reshuffle rounds.
// Keep Group mode: counts completed games at each (fixed) group.
function stageRoundsComplete(stageId) {
  const active = activeGroupsForStage(stageId);
  if (!active.length) return 0;
  const ss = getStageSettings(stageId);
  if (ss.shuffleAfterGame) {
    const curRound = stageCurrentRound(stageId);
    const allDone = active.every(g => completedGamesForGroup(g.id).length > 0);
    return allDone ? curRound : curRound - 1;
  } else {
    return Math.min(...active.map(g => completedGamesForGroup(g.id).length));
  }
}

function avatarBg(pid) {
  const photo = photoCache[pid];
  if (!photo) return '';
  return `background-image:url(${photo});background-size:cover;background-position:center;color:transparent;`;
}

function loadPhotos(tid) {
  if (!tid || !S.participants.length) return;
  const promises = S.participants.map(p =>
    db.collection('playerPhotos').doc(tid + '_' + p.id).get()
  );
  Promise.all(promises).then(docs => {
    let updated = false;
    docs.forEach(doc => {

}

function openFilePicker(pid) {
  if (!pid) return;
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.style.display = 'none';
  document.body.appendChild(inp);
  inp.addEventListener('change', () => {
    const file = inp.files[0];
    document.body.removeChild(inp);
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        cropState = { playerId: pid, img, offsetX: 0, offsetY: 0, zoom: 1 };
        render();
        setTimeout(() => { drawCropCanvas(); setupCropDrag(); }, 50);
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
  inp.click();
}

function drawCropCanvas() {
  const canvas = document.getElementById('crop-canvas');
  if (!canvas || !cropState || !cropState.img) return;
  const ctx = canvas.getContext('2d');
  const size = 240;
  ctx.clearRect(0, 0, size, size);
  ctx.save();
  ctx.beginPath();
  ctx.arc(size/2, size/2, size/2, 0, Math.PI*2);
  ctx.clip();
  const img = cropState.img;
  const baseScale = Math.max(size/img.naturalWidth, size/img.naturalHeight) * cropState.zoom;
  const imgW = img.naturalWidth * baseScale;
  const imgH = img.naturalHeight * baseScale;
  ctx.drawImage(img, size/2 + cropState.offsetX - imgW/2, size/2 + cropState.offsetY - imgH/2, imgW, imgH);
  ctx.restore();
}

function setupCropDrag() {
  const canvas = document.getElementById('crop-canvas');
  if (!canvas || !cropState) return;
  const zoomInp = document.getElementById('crop-zoom');
  if (zoomInp) {
    zoomInp.value = cropState.zoom;
    zoomInp.addEventListener('input', () => { cropState.zoom = parseFloat(zoomInp.value); drawCropCanvas(); });
  }
  let lastX = 0, lastY = 0, dragging = false;
  const onStart = (x, y) => { dragging = true; lastX = x; lastY = y; canvas.style.cursor = 'grabbing'; };
  const onMove = (x, y) => {
    if (!dragging) return;
    cropState.offsetX += x - lastX; cropState.offsetY += y - lastY;
    lastX = x; lastY = y; drawCropCanvas();
  };
  const onEnd = () => { dragging = false; canvas.style.cursor = 'grab'; };
  canvas.addEventListener('mousedown', e => { e.preventDefault(); onStart(e.clientX, e.clientY); });
  window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
  window.addEventListener('mouseup', onEnd);
  canvas.addEventListener('touchstart', e => { e.preventDefault(); onStart(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});
  canvas.addEventListener('touchmove', e => { e.preventDefault(); onMove(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});
  canvas.addEventListener('touchend', onEnd);
}

function doApplyPhotoCrop() {
  if (!cropState) return;
  const out = document.createElement('canvas');
  out.width = 200; out.height = 200;
  const ctx = out.getContext('2d');
  ctx.beginPath(); ctx.arc(100, 100, 100, 0, Math.PI*2); ctx.clip();
  const img = cropState.img;
  const scale200 = 200/240;
  const baseScale = Math.max(240/img.naturalWidth, 240/img.naturalHeight) * cropState.zoom;
  const imgW = img.naturalWidth * baseScale * scale200;
  const imgH = img.naturalHeight * baseScale * scale200;
  ctx.drawImage(img, 100 + cropState.offsetX*scale200 - imgW/2, 100 + cropState.offsetY*scale200 - imgH/2, imgW, imgH);
  const dataUrl = out.toDataURL('image/jpeg', 0.82);
  const pid = cropState.playerId;
  cropState = null;
  photoCache[pid] = dataUrl;
  savePhotoToFirestore(pid, dataUrl);
  render();
}

function buildBrackets() {
  if (!S.stages.length) return `<div class="empty"><div class="empty-icon">🏆</div><p>No stages set up yet. Ask the admin to configure the tournament.</p></div>`;

  let html = '<div style="padding:16px;display:flex;flex-direction:column;gap:20px;">';
  S.stages.forEach(stage => {
    const ssB = getStageSettings(stage.id);
    const gpsB = ssB.gamesPerStage || 1;
    const groups = activeGroupsForStage(stage.id);
    const rdoneB = stageRoundsComplete(stage.id);
    const roundLabel = gpsB > 1 ? ` · Game ${rdoneB + 1}/${gpsB}` : '';
    html += `<div class="stage-block">
      <div class="stage-label">${escH(stage.name)}${roundLabel} ${stage.status==='complete'?'<span class="badge badge-green">Complete</span>':''}</div>
      ${groups.length===0?`<div style="padding:0 16px;color:var(--muted);font-size:13px;">No groups yet</div>`:''}
      ${groups.map(group => {
        const game = activeGameForGroup(group.id) || completedGamesForGroup(group.id).slice(-1)[0];
        const cum = game ? cumulative(game) : null;
        return `<div class="bracket-group">
          <div class="bracket-group-hdr">
            <div class="bracket-group-name">${escH(group.name)}</div>
            ${game && !game.completed ? '<span class="badge badge-blue">● Active</span>' : ''}
            ${game && game.completed ? '<span class="badge badge-green">✓ Done</span>' : ''}
            ${!game ? '<span class="badge badge-muted">Not started</span>' : ''}
          </div>
          <div class="bracket-players">
            ${group.participantIds.map(pid => {
              const p = getPart(pid);
              const isWinner = game?.completed && game.winnerId === pid;
              const total = cum ? (()=>{ const sc=cum[pid]||[]; return sc.length?sc[sc.length-1]:0; })() : null;
              const bg = avatarBg(pid);
              return `<div class="bracket-player ${isWinner?'winner':''}">
                <div class="bracket-avatar ${isWinner?'winner-av':''}" style="${bg}">${bg?'':escH(initials(p?.name||'?'))}</div>
                <div class="bracket-pname ${isWinner?'winner':''}">${escH(p?.name||'?')}</div>
                ${total!==null?`<div class="fw7 ${total>=0?'pos':'neg'}">${total}</div>`:''}
                ${isWinner?'<span class="text-gold">🏆</span>':''}
              </div>`;
            }).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>`;
  });
  html += '</div>';
  return html;
}

function buildLeaderboard() {
  const stats = allStats();
  const sortKey = S.lbSort;
  const sorted = [...S.participants].sort((a,b) => {
    const sa=stats[a.id]||{}, sb=stats[b.id]||{};
    if (sortKey==='played') return (sb.gamesPlayed-sa.gamesPlayed)||(sb.gamesWon-sa.gamesWon);
    if (sortKey==='wins') return (sb.gamesWon-sa.gamesWon)||(sb.totalPoints-sa.totalPoints);
    return (sb.totalPoints-sa.totalPoints)||(sb.gamesWon-sa.gamesWon);
  });

  if (!sorted.length) return `<div class="empty"><div class="empty-icon">📊</div><p>No players yet. Ask the admin to add participants.</p></div>`;

  const medals = ['🥇','🥈','🥉'];
  return `
    <div class="section" style="gap:12px">
      <div class="lb-filters">
        <button class="lb-filter ${sortKey==='wins'?'active':''}" data-a="setLbSort" data-v="wins">Most Wins</button>
        <button class="lb-filter ${sortKey==='points'?'active':''}" data-a="setLbSort" data-v="points">Most Points</button>
        <button class="lb-filter ${sortKey==='played'?'active':''}" data-a="setLbSort" data-v="played">Games Played</button>
      </div>
      <div class="card">
        ${sorted.map((p,i) => {
          const st = stats[p.id]||{totalPoints:0,gamesWon:0,gamesPlayed:0};
          const col = p.collectionId?getCol(p.collectionId):null;
          const mainVal = sortKey==='wins' ? st.gamesWon : sortKey==='points' ? st.totalPoints : st.gamesPlayed;
          const mainLabel = sortKey==='wins' ? 'wins' : sortKey==='points' ? 'pts' : 'played';
          const sub = sortKey==='wins' ? `${st.gamesPlayed} played · ${st.totalPoints>=0?'+':''}${st.totalPoints} pts` :
                      sortKey==='points' ? `${st.gamesPlayed} played · ${st.gamesWon} wins` :
                      `${st.gamesWon} wins · ${st.totalPoints>=0?'+':''}${st.totalPoints} pts`;
          const lbBg = avatarBg(p.id);
          return `<div class="lb-row">
            <div class="lb-rank">${i<3?medals[i]:i+1}</div>
            <div class="lb-avatar" style="${col&&!lbBg?`border-color:${col.color};color:${col.color};`:''}${lbBg}">
              ${lbBg?'':escH(initials(p.name))}
            </div>
            <div style="flex:1">
              <div class="lb-name">${escH(p.name)}</div>
              <div style="font-size:11px;color:var(--muted)">${sub}</div>
            </div>
            <div class="lb-stat">
              <div class="lb-stat-val ${sortKey==='points'&&mainVal<0?'neg':'pos'}">${mainVal>=0&&sortKey==='points'?'+':''}${mainVal}</div>
              <div class="lb-stat-sub">${mainLabel}</div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
}

function buildScoresList() {

        const active = activeGameForGroup(group.id);

            <div class="group-info-sub">${escH(stage?.name||'')} · ${players.map(p=>initials(p?.name||'?')).join(', ')} · ${done.length} game${done.length!==1?'s':''} done</div>
          </div>

function buildScorecard() {
  const gid = S.activeGroupId;
  const group = getGroup(gid);
  if (!group) return `<div class="empty"><p>Group not found.</p></div>`;

  const activeGame = activeGameForGroup(gid);
  const doneGames = completedGamesForGroup(gid);

  let html = '';

  if (activeGame) {
    html += buildActiveScorecardView(activeGame);
  } else {
    const stage = getStage(group.stageId);
    const ssSc = getStageSettings(group.stageId);
    const gps = ssSc.gamesPerStage || 1;
    const rdone = stageRoundsComplete(group.stageId);
    const roundInfo = gps > 1 ? ` · Game ${Math.min(rdone + 1, gps)}/${gps}` : '';
    html += `<div style="padding:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <span style="font-size:13px;color:var(--muted)">${escH(stage?.name||'')}${roundInfo} · ${group.participantIds.length} players</span>
      <button class="btn btn-primary btn-sm" data-a="startGame" data-gid="${gid}">▶ New Game</button>
    </div>`;
  }

  if (doneGames.length) {
    html += `<div class="sc-history">
      <div class="sc-history-title">Completed Games (${doneGames.length})</div>
      ${doneGames.map((game,i) => buildCompletedGameSummary(game, i+1)).join('')}
    </div>`;
  }

  if (!activeGame && !doneGames.length) {
    html += `<div class="empty"><div class="empty-icon">🎴</div><p>No games yet. Start a game to begin scoring.</p></div>`;
  }

  return html;
}

function buildActiveScorecardView(game) {
  const group4scv = getGroup(game.groupId);
  const ss4scv = group4scv ? getStageSettings(group4scv.stageId) : S.settings;
  const cum = cumulative(game);
  const target = ss4scv.pointsToWin;
  const over = gameIsOver(game);
  const round = S.roundInputs;

  // Check which players have input for current round
  const hasRoundInput = pid => round[pid] !== undefined && round[pid] !== '';
  const allHaveInput = game.participantIds.every(pid => hasRoundInput(pid));

  const currentRoundNum = game.rounds.length + 1;

  let html = '';

  // Round header
  const group4sc = getGroup(game.groupId);
  const ss4sc = group4sc ? getStageSettings(group4sc.stageId) : S.settings;
  const gpsAct = ss4sc.gamesPerStage || 1;
  const rdoneAct = group4sc ? stageRoundsComplete(group4sc.stageId) : 0;
  const stageRoundLabel = gpsAct > 1 ? ` · Stage Game ${Math.min(rdoneAct + 1, gpsAct)}/${gpsAct}` : '';
  html += `<div class="sc-round-info" style="padding:14px 16px 4px">
    <div class="sc-round-label">${over?'Game Over':'Round '+currentRoundNum}</div>
    <div class="sc-target">Target: ${target} pts${stageRoundLabel}</div>
  </div>`;

  // Player tiles (current round input)
  if (!over) {
    html += `<div class="sc-players">`;
    game.participantIds.forEach(pid => {
      const p = getPart(pid);
      const col = p?.collectionId ? getCol(p.collectionId) : null;
      const inp = round[pid];
      const hasScore = inp !== undefined && inp !== '';
      const isNA = inp === 'NA';
      const sc = cum[pid]||[];
      const total = sc.length ? sc[sc.length-1] : 0;

      const scBg = avatarBg(pid);
      html += `<div class="sc-player-tile" data-a="openScoreModal" data-pid="${pid}">
        <div class="sc-avatar ${hasScore&&!isNA?'has-score':''} ${isNA?'is-na':''}" style="${col&&!scBg?`border-color:${col.color};`:''}${scBg}">
          ${scBg?'':escH(initials(p?.name||'?'))}
          ${hasScore?`<div class="sc-avatar-check">${isNA?'—':'✓'}</div>`:''}
        </div>
        <div class="sc-pname">${escH(p?.name||'?')}</div>
        <div class="sc-pscore ${total>=0?'pos':'neg'}">${total}</div>
      </div>`;
    });
    html += `</div>`;

    // Instruction
    if (!allHaveInput) {
      html += `<div style="padding:4px 16px 12px;font-size:13px;color:var(--muted)">Tap a player to enter their round score</div>`;
    }
  }

  // Progress bars
  html += `<div class="sc-progress">`;
  game.participantIds.forEach(pid => {
    const p = getPart(pid);
    const sc = cum[pid]||[];
    const total = sc.length ? sc[sc.length-1] : 0;
    const pct = Math.min(100, Math.max(0, (total/target)*100));
    const hit = total >= target;
    html += `<div class="sc-progress-row">
      <div class="sc-progress-name">${escH(initials(p?.name||'?'))} ${escH((p?.name||'').split(' ')[0])}</div>
      <div class="sc-progress-bar-wrap"><div class="sc-progress-fill ${hit?'hit':''}" style="width:${pct}%"></div></div>
      <div class="sc-progress-pts ${hit?'text-gold':total>=0?'pos':'neg'}">${total}</div>
    </div>`;
  });
  html += `</div>`;

  // Actions
  html += `<div class="sc-actions">`;
  if (over) {
    const wid = gameWinnerId(game);
    const wp = getPart(wid);
    html += `<div class="sc-winner-banner">🏆 ${escH(wp?.name||'?')} wins this game!</div>`;
    html += `<button class="btn btn-gold btn-full" data-a="completeGame" data-gid="${game.id}">Save & Complete Game</button>`;
  } else if (allHaveInput) {
    html += `<button class="btn btn-primary btn-full" data-a="submitRound" data-gid="${game.id}">Submit Round ${currentRoundNum}</button>`;
    html += `<button class="btn btn-ghost btn-full btn-sm" data-a="endGame" data-gid="${game.id}">End Game Early</button>`;
  } else {
    html += `<button class="btn btn-ghost btn-full btn-sm" data-a="endGame" data-gid="${game.id}">End Game Early</button>`;
  }
  html += `</div>`;

  // Round history
  if (game.rounds.length > 0) {
    html += buildRoundHistory(game, cum);
  }

  return html;
}

function buildRoundHistory(game, cum) {
  const players = game.participantIds.map(pid=>getPart(pid));
  let html = `<div class="sc-history">
    <div class="sc-history-title">Round History</div>
    <div class="sc-table-wrap"><table class="sc-table">
      <thead><tr>
        <th class="round-col">Rd</th>
        ${players.map(p=>`<th>${escH(initials(p?.name||'?'))}</th>`).join('')}
      </tr></thead>
      <tbody>`;

  game.rounds.forEach((round, ri) => {
    html += `<tr>
      <td class="round-col">${ri+1}</td>
      ${game.participantIds.map(pid => {
        const v = round[pid];
        const total = (cum[pid]||[])[ri]||0;
        if (v === 'NA') return `<td class="na-cell">N/A</td>`;
        const n = Number(v)||0;
        return `<td>
          <div class="${n>=0?'pos':'neg'}">${n>=0?'+':''}${n}</div>
          <div style="font-size:10px;color:var(--muted)">${total}</div>
        </td>`;
      }).join('')}
    </tr>`;
  });

  // Totals row
  html += `<tr class="total-row">
    <td class="round-col" style="font-weight:700">Total</td>
    ${game.participantIds.map(pid => {
      const sc = cum[pid]||[];
      const total = sc.length?sc[sc.length-1]:0;
      return `<td class="${total>=0?'pos':'neg'}" style="font-weight:700">${total}</td>`;
    }).join('')}
  </tr>`;

  html += `</tbody></table></div></div>`;
  return html;
}

function buildCompletedGameSummary(game, num) {
  const cum = cumulative(game);
  const winner = getPart(game.winnerId);
  const players = game.participantIds.map(pid=>getPart(pid));

  return `<div style="border-top:1px solid var(--border)">
    <div style="display:flex;align-items:center;gap:10px;padding:12px 16px">
      <div style="font-size:13px;color:var(--muted);font-weight:700">Game ${num}</div>
      <span class="badge badge-gold">🏆 ${escH(winner?.name||'?')}</span>
    </div>
    <div class="sc-table-wrap"><table class="sc-table">
      <thead><tr>
        <th class="round-col">Rd</th>
        ${players.map(p=>`<th ${game.winnerId===p?.id?'class="winner-col"':''}>${escH(initials(p?.name||'?'))}</th>`).join('')}
      </tr></thead>
      <tbody>
        ${game.rounds.map((round,ri)=>`<tr>
          <td class="round-col">${ri+1}</td>
          ${game.participantIds.map(pid=>{
            const v=round[pid], total=(cum[pid]||[])[ri]||0;
            if(v==='NA') return `<td class="na-cell">N/A</td>`;
            const n=Number(v)||0;
            return `<td ${game.winnerId===pid?'class="winner-col"':''}><div class="${n>=0?'pos':'neg'}">${n>=0?'+':''}${n}</div><div style="font-size:10px;color:var(--muted)">${total}</div></td>`;
          }).join('')}
        </tr>`).join('')}
        <tr class="total-row">
          <td class="round-col" style="font-weight:700">Final</td>
          ${game.participantIds.map(pid=>{
            const sc=cum[pid]||[];
            const total=sc.length?sc[sc.length-1]:0;
            return `<td ${game.winnerId===pid?'class="winner-col"':''}><span class="${total>=0?'pos':'neg'}">${total}</span></td>`;
          }).join('')}
        </tr>
      </tbody>
    </table></div>
  </div>`;
}

function buildScoreModal() {

    <button class="btn btn-primary btn-full" data-a="saveSettings">Save Settings</button>
    <button class="btn btn-danger btn-full btn-sm" data-a="resetAll">⚠ Reset Tournament</button>
    ${S.stages.length > 0 ? `
    <div class="divider"></div>
    <div class="section-title">Per-Stage Settings</div>
    <div style="font-size:12px;color:var(--muted);margin-top:-8px">Override defaults above for individual stages. Changes save immediately.</div>
    ${S.stages.map(stage => {
      const ssOpen = openStageSettingsPanels.has(stage.id);
      return `<div class="card">
        <div class="card-header" style="padding:12px 14px">
          <div class="card-title" style="font-size:14px">${escH(stage.name)}</div>
          <button class="btn btn-ghost btn-xs" data-a="toggleStageSettings" data-sid="${stage.id}">${ssOpen ? '▲ Hide' : '▼ Configure'}</button>
        </div>
        ${ssOpen ? `<div style="padding:12px 16px;border-top:1px solid var(--border)">${buildStageSettingsPanel(stage)}</div>` : ''}
      </div>`;
    }).join('')}` : ''}
  </div>`;
}

function buildAdminPlayers() {
  const cols = S.collections;
  const byCol = {}, none = [];
  S.participants.forEach(p => {
    p.collectionId ? (byCol[p.collectionId]=byCol[p.collectionId]||[]).push(p) : none.push(p);
  });

  let listHtml = '';
  cols.forEach(c => {
    const ps = byCol[c.id]||[];
    if (!ps.length) return;
    listHtml += `<div class="card" style="margin:0">
      <div class="card-header" style="border-bottom:1px solid var(--border);border-left:3px solid ${c.color}">
        <div class="card-title" style="color:${c.color}">${escH(c.name)}</div>
        <span class="badge badge-muted">${ps.length}</span>
      </div>
      ${ps.map(p=>playerRow(p)).join('')}
    </div>`;
  });
  if (none.length) {
    listHtml += `<div class="card" style="margin:0">
      ${cols.length?`<div class="card-header" style="border-bottom:1px solid var(--border)"><div class="card-title text-muted">No Collection</div></div>`:''}
      ${none.map(p=>playerRow(p)).join('')}
    </div>`;
  }

  return `<div class="section" style="gap:12px">
    <div class="card">
      <div class="card-header">
        <div class="card-title">Collections</div>
        <button class="btn btn-ghost btn-xs" data-a="toggleForm" data-f="col-form">+ Add</button>
      </div>
      <div id="col-form" class="hidden" style="padding:12px 16px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--border)">
        <input type="text" class="input input-sm" id="col-name" placeholder="e.g. Kids, Beginners, Advanced">
        <div style="display:flex;gap:10px;align-items:center">
          <input type="color" id="col-color" value="#4f8ef7">
          <span class="text-muted" style="font-size:13px">Pick a color</span>
        </div>
        <div class="btn-row">
          <button class="btn btn-primary btn-sm" data-a="addCollection">Add Collection</button>
          <button class="btn btn-ghost btn-sm" data-a="toggleForm" data-f="col-form">Cancel</button>
        </div>
      </div>
      ${cols.length===0?`<div style="padding:12px 16px;font-size:13px;color:var(--muted)">Optional: group players by skill level or age.</div>`:''}
      ${cols.length?`<div style="padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid var(--border)">
        ${cols.map(c=>`<div class="chip"><span class="chip-dot" style="background:${c.color}"></span>${escH(c.name)}<button class="btn-icon red" data-a="deleteCollection" data-id="${c.id}" style="font-size:14px;padding:0 2px">×</button></div>`).join('')}
      </div>`:''}
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title">Players <span class="badge badge-muted">${S.participants.length}</span></div>
        <button class="btn btn-ghost btn-xs" data-a="toggleForm" data-f="part-form">+ Add</button>
      </div>
      <div id="part-form" class="hidden" style="padding:12px 16px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--border)">
        <input type="text" class="input input-sm" id="part-name" placeholder="Player name">
        ${cols.length?`<select class="input input-sm" id="part-col">
          <option value="">No collection</option>
          ${cols.map(c=>`<option value="${c.id}">${escH(c.name)}</option>`).join('')}
        </select>`:''}
        <div class="btn-row">
          <button class="btn btn-primary btn-sm" data-a="addPlayer">Add Player</button>
          <button class="btn btn-ghost btn-sm" data-a="toggleForm" data-f="part-form">Cancel</button>
        </div>
      </div>
      ${!S.participants.length?`<div style="padding:12px 16px;font-size:13px;color:var(--muted)">Add players to get started.</div>`:''}

    ${listHtml}
  </div>`;
}

function playerRow(p) {
  const c = p.collectionId ? getCol(p.collectionId) : null;
  const bg = avatarBg(p.id);
  const avStyle = bg ? bg : (c ? `border-color:${c.color};color:${c.color}` : '');
  return `<div class="list-row">
    <div class="bracket-avatar" data-a="openPhotoCrop" data-pid="${p.id}" title="Change photo" style="${avStyle};cursor:pointer">
      ${bg?'':escH(initials(p.name))}
    </div>
    <div style="flex:1">
      <div style="font-size:15px;font-weight:600">${escH(p.name)}</div>
      ${c?`<div style="font-size:12px;color:var(--muted)">${escH(c.name)}</div>`:''}
    </div>
    ${S.collections.length?`<select class="input input-sm" data-a="setPlayerCol" data-id="${p.id}" style="width:auto;min-width:100px">
      <option value="">None</option>
      ${S.collections.map(c2=>`<option value="${c2.id}" ${p.collectionId===c2.id?'selected':''}>${escH(c2.name)}</option>`).join('')}
    </select>`:''}
    <button class="btn-icon" data-a="openPhotoCrop" data-pid="${p.id}" title="Add/change photo" style="font-size:16px">📷</button>
    <button class="btn-icon red" data-a="deletePlayer" data-id="${p.id}">×</button>
  </div>`;
}

function stageAssignmentMode(stageId) {
  const idx = S.stages.findIndex(s => s.id === stageId);
  const lastIdx = S.stages.length - 1;
  if (idx <= 0 || S.stages.length === 1) return S.settings.firstStageAssignment;
  if (idx === lastIdx) return S.settings.finalsAssignment;
  return S.settings.laterStageAssignment;
}

function groupStatusBadge(status) {
  if (status === 'active') return `<span class="badge badge-blue">● Active</span>`;
  if (status === 'final')  return `<span class="badge badge-green">✓ Final</span>`;
  return `<span class="badge badge-muted">Not Started</span>`;
}

  const ss = getStageSettings(stage.id);
  const sid = stage.id;
  const def = (k) => (stage.settings || {})[k] === undefined ? ' <span style="font-size:10px;color:var(--muted)">(global)</span>' : '';
  return `<div style="margin-top:10px;display:flex;flex-direction:column;gap:12px">
    <div class="field">
      <div class="label" style="font-size:11px">Max Players/Group${def('gameSize')}</div>
      <div class="seg">${[2,3,4,5].map(n=>`<button class="seg-btn ${ss.gameSize===n?'active':''}" data-a="setStageSetting" data-sid="${sid}" data-k="gameSize" data-v="${n}">${n}</button>`).join('')}</div>
    </div>
    <div class="field">
      <div class="label" style="font-size:11px">Min Players/Group${def('minGroupSize')}</div>
      <div class="seg">${[2,3,4,5].map(n=>`<button class="seg-btn ${ss.minGroupSize===n?'active':''}" data-a="setStageSetting" data-sid="${sid}" data-k="minGroupSize" data-v="${n}">${n}</button>`).join('')}</div>
    </div>
    <div class="field">
      <div class="label" style="font-size:11px">Games per Stage${def('gamesPerStage')}</div>
      <div class="seg">${[1,2,3,4,5].map(n=>`<button class="seg-btn ${ss.gamesPerStage===n?'active':''}" data-a="setStageSetting" data-sid="${sid}" data-k="gamesPerStage" data-v="${n}">${n}</button>`).join('')}</div>
    </div>
    <div class="field">
      <div class="label" style="font-size:11px">Points to Win${def('pointsToWin')}</div>
      <input type="number" class="input input-sm" value="${ss.pointsToWin}" data-a="setStageSettingNum" data-sid="${sid}" data-k="pointsToWin" inputmode="numeric" min="1">
    </div>
    <div class="field">
      <div class="label" style="font-size:11px">After Each Game${def('shuffleAfterGame')}</div>
      <div class="seg">
        <button class="seg-btn ${!ss.shuffleAfterGame?'active':''}" data-a="setStageSetting" data-sid="${sid}" data-k="shuffleAfterGame" data-v="false">Keep Group</button>
        <button class="seg-btn ${ss.shuffleAfterGame?'active':''}" data-a="setStageSetting" data-sid="${sid}" data-k="shuffleAfterGame" data-v="true">Shuffle</button>
      </div>
    </div>
    <div class="field">
      <div class="label" style="font-size:11px">Collections${def('mixCollections')}</div>
      <div class="seg">
        <button class="seg-btn ${!ss.mixCollections?'active':''}" data-a="setStageSetting" data-sid="${sid}" data-k="mixCollections" data-v="false">Stay Separated</button>
        <button class="seg-btn ${ss.mixCollections?'active':''}" data-a="setStageSetting" data-sid="${sid}" data-k="mixCollections" data-v="true">Mix Together</button>
      </div>
    </div>
    ${!ss.isFinal ? `
    <div class="field">
      <div class="label" style="font-size:11px">Advancement Method${def('advancementMethod')}</div>
      <div class="seg">
        <button class="seg-btn ${ss.advancementMethod==='wins'?'active':''}" data-a="setStageSetting" data-sid="${sid}" data-k="advancementMethod" data-v="wins">Most Wins</button>
        <button class="seg-btn ${ss.advancementMethod==='points'?'active':''}" data-a="setStageSetting" data-sid="${sid}" data-k="advancementMethod" data-v="points">Most Points</button>
      </div>
    </div>
    <div class="field">
      <div class="label" style="font-size:11px">Players Advancing/Collection${def('advancersPerCollection')}</div>
      <div class="seg">${[1,2,3,4,5].map(n=>`<button class="seg-btn ${ss.advancersPerCollection===n?'active':''}" data-a="setStageSetting" data-sid="${sid}" data-k="advancersPerCollection" data-v="${n}">${n}</button>`).join('')}</div>
    </div>` : ''}
    <div class="field">
      <div class="label" style="font-size:11px">Stage Type${def('isFinal')}</div>
      <div class="seg">
        <button class="seg-btn ${!ss.isFinal?'active':''}" data-a="setStageSetting" data-sid="${sid}" data-k="isFinal" data-v="false">Advance Players</button>
        <button class="seg-btn ${ss.isFinal?'active':''}" data-a="setStageSetting" data-sid="${sid}" data-k="isFinal" data-v="true">Final Stage</button>

function buildAdminStages() {
  const totalStages = S.stages.length;
  const lastStage = totalStages > 0 ? S.stages[totalStages - 1] : null;
  const canAdd = !lastStage || stageIsFullyDone(lastStage.id);

  return `<div class="section" style="gap:12px">
    <div>
      <button class="btn btn-primary btn-sm" data-a="addStage" ${canAdd?'':'disabled style="opacity:0.45;cursor:not-allowed"'}>+ Add Stage</button>
      ${!canAdd ? `<div style="font-size:12px;color:var(--muted);margin-top:6px">Complete all games in ${escH(lastStage.name)} to unlock the next stage.</div>` : ''}
    </div>

    ${totalStages===0?`<div class="empty"><div class="empty-icon">🏆</div><p>Add a stage to get started. Configure per-stage settings in the Settings tab.</p></div>`:''}

    ${S.stages.map((stage, stageIdx) => {
      const ss = getStageSettings(stage.id);
      const stageGroups = activeGroupsForStage(stage.id);
      const ua = unassigned(stage.id);
      const mode = stageAssignmentMode(stage.id);
      const isManual = mode === 'manual';
      const isFirstStage = stageIdx === 0;
      const isFinals = ss.isFinal || (stageIdx === totalStages - 1 && totalStages > 1);
      const isLaterStage = !isFirstStage && !isFinals;
      const stageDone = stageIsFullyDone(stage.id);
      const stageHasGames = S.games.some(game => {
        const g = getGroup(game.groupId);
        return g && g.stageId === stage.id;
      });
      const gpsA = ss.gamesPerStage || 1;

      // Stage-level status
      const stageBadge = stage.status === 'complete'
        ? `<span class="badge badge-green">Complete</span>`
        : stageDone
          ? `<span class="badge badge-gold">All Done</span>`
          : stageHasGames
            ? `<span class="badge badge-blue">In Progress</span>`
            : `<span class="badge badge-muted">Not Started</span>`;

      const assignBtn = stage.status !== 'complete' ? (
        isFirstStage && mode === 'random' ? (stageHasGames
          ? `<button class="btn btn-ghost btn-xs" disabled title="Scores entered — cannot re-randomize" style="opacity:0.45;cursor:not-allowed">🔀 Randomize</button>`
          : `<button class="btn btn-ghost btn-xs" data-a="randomizeStage" data-sid="${stage.id}">🔀 Randomize</button>`) :
        isLaterStage && mode === 'collection' ? `<button class="btn btn-ghost btn-xs" data-a="autoAssignFromPrev" data-sid="${stage.id}">↑ Auto-assign</button>` :
        isFinals && mode === 'auto' ? `<button class="btn btn-ghost btn-xs" data-a="generateFinals" data-sid="${stage.id}">🏆 Generate Finals</button>` : ''
      ) : '';

      return `<div class="card">
        <div class="card-header">
          <div style="flex:1">
            <div class="card-title">${escH(stage.name)}${isFinals?` <span style="font-size:11px;color:var(--gold)">★ Final</span>`:''}</div>
            ${gpsA > 1 ? `<div style="font-size:12px;color:var(--muted);margin-top:2px">${gpsA} games required per group</div>` : ''}
          </div>
          <div class="btn-row">
            ${stage.status !== 'complete' ? `<button class="btn btn-ghost btn-xs" data-a="addGroup" data-sid="${stage.id}">+ Group</button>` : ''}
            ${assignBtn}
            ${stageBadge}
          </div>
        </div>

        ${stageGroups.length === 0 ? `<div style="padding:12px 14px;font-size:13px;color:var(--muted)">${isManual?'Add groups and assign players manually.':isFinals?'Use Generate Finals to auto-create the finals group.':isFirstStage?'Use Randomize to auto-assign all players into groups.':'Use Auto-assign to pull advancers from the previous stage.'}</div>` : ''}

        ${stageGroups.map(group => {
          const gStatus = groupStatus(group.id, stage.id);
          const active = activeGameForGroup(group.id);
          const done = completedGamesForGroup(group.id);
          return `<div style="border-top:1px solid var(--border);padding:12px 14px">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:${group.participantIds.length?'8':'0'}px">
              <div style="font-size:14px;font-weight:700;flex:1">${escH(group.name)}</div>
              ${groupStatusBadge(gStatus)}
              ${done.length ? `<span style="font-size:11px;color:var(--muted)">${done.length}/${gpsA} game${gpsA!==1?'s':''}</span>` : ''}
              <button class="btn-icon red" data-a="deleteGroup" data-id="${group.id}">×</button>
            </div>
            ${group.participantIds.length ? `<div class="chips">
              ${group.participantIds.map(pid => {
                const p = getPart(pid);
                const col = p?.collectionId ? getCol(p.collectionId) : null;
                return `<div class="chip">${col?`<span class="chip-dot" style="background:${col.color}"></span>`:''}${escH(p?.name||'?')}${isManual&&gStatus==='pending'?`<button class="btn-icon" data-a="removeFromGroup" data-gid="${group.id}" data-pid="${pid}" style="font-size:12px;padding:0 2px">×</button>`:''}</div>`;
              }).join('')}
            </div>` : ''}
            ${isManual && ua.length > 0 && gStatus === 'pending' ? `<div style="margin-top:8px;display:flex;gap:6px">
              <select class="input input-sm" id="atg-${group.id}" style="flex:1">
                <option value="">Add player…</option>
                ${ua.map(p=>`<option value="${p.id}">${escH(p.name)}</option>`).join('')}
              </select>
              <button class="btn btn-ghost btn-sm" data-a="addToGroup" data-gid="${group.id}">Add</button>
            </div>` : ''}
            ${!active && done.length ? `<div style="margin-top:8px"><button class="btn btn-ghost btn-xs" data-a="reopenGame" data-id="${done[done.length-1].id}">↩ Reopen Last Game</button></div>` : ''}
          </div>`;
        }).join('')}

        ${isManual && ua.length > 0 && stageGroups.length > 0 ? `<div style="padding:8px 14px;font-size:12px;color:var(--muted);border-top:1px solid var(--border)">${ua.length} player${ua.length!==1?'s':''} not yet assigned to a group</div>` : ''}
        ${stageDone && stage.status !== 'complete' ? `<div style="padding:10px 14px;font-size:13px;color:var(--green);border-top:1px solid var(--border);font-weight:600">✓ All games complete. ${isFinals ? 'Declare the winner!' : 'Ready to advance players to the next stage.'}</div>` : ''}

        <div style="border-top:1px solid var(--border);padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap">
          ${stage.status === 'active' ? `<button class="btn btn-ghost btn-xs" data-a="markStageComplete" data-id="${stage.id}">Mark Complete</button>` : ''}
          <button class="btn btn-danger btn-xs" data-a="deleteStage" data-id="${stage.id}">Delete Stage</button>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

function buildAdminStandings() {
  const stats = allStats();
  const method = S.settings.advancementMethod;
  const sorted = [...S.participants].sort((a,b)=>{
    const sa=stats[a.id]||{}, sb=stats[b.id]||{};
    if (method==='wins') return (sb.gamesWon-sa.gamesWon)||(sb.totalPoints-sa.totalPoints);
    return (sb.totalPoints-sa.totalPoints)||(sb.gamesWon-sa.gamesWon);
  });

  if (!sorted.length) return `<div class="empty"><div class="empty-icon">🏆</div><p>Standings appear after games are completed.</p></div>`;

  return `<div class="section"><div class="card">
    ${sorted.map((p,i)=>{
      const st=stats[p.id]||{totalPoints:0,gamesWon:0,gamesPlayed:0};
      const col=p.collectionId?getCol(p.collectionId):null;
      const medals=['🥇','🥈','🥉'];
      const stBg = avatarBg(p.id);
      return `<div class="list-row">
        <div style="font-size:18px;width:28px;text-align:center">${i<3?medals[i]:i+1}</div>
        <div class="bracket-avatar" style="${col&&!stBg?`border-color:${col.color};color:${col.color};`:''}${stBg}">
          ${stBg?'':escH(initials(p.name))}
        </div>
        <div style="flex:1">
          <div style="font-size:15px;font-weight:600">${escH(p.name)}</div>
          <div style="font-size:12px;color:var(--muted)">${st.gamesPlayed} played · ${st.gamesWon} wins</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:16px;font-weight:700" class="${st.totalPoints>=0?'pos':'neg'}">${st.totalPoints>=0?'+':''}${st.totalPoints}</div>
          <div style="font-size:11px;color:var(--muted)">points</div>
        </div>
      </div>`;
    }).join('')}
  </div></div>`;
}

// EVENTS
