    #app { max-width: 480px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; position: relative; z-index: 1; }

    /* HEADER */
    .hdr { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 16px; padding-top: var(--st); position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow-xs); }
    .hdr-inner { display: flex; align-items: center; height: 52px; gap: 10px; }
    .hdr-back { width: 40px; height: 40px; border: none; background: none; color: var(--accent); font-size: 22px; cursor: pointer; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background .12s; }
    .hdr-back:active { background: var(--surface2); }

  scoring: `After each round:\n• +1 point for every card you got onto the center foundations.\n• −2 points for every card left in your Nertz pile.\n\nThe first player to reach the target score (set by the tournament) wins the match.`,

  houseRules: `• Once someone calls "Nertz," you can't move any cards. If there was a card already in your hand, it can be placed down to its intended destination.\n• If you have more than one card that can be placed in the Foundation Piles, you can only place one card at a time — you cannot prestack them before placing down. You cannot pick up more than two cards from your work piles at a time and each card must be in a separate hand.\n• When moving cards from your work piles to foundation piles, you can either move the top card of a stack or the back card of a stack if it's able to be placed.\n• When moving a work pile from one to another, you must pick up and move the whole pile on top of another. You cannot pick up a single card and place it under another pile.`,
};

function loadLibraryLS() {
  try { return JSON.parse(localStorage.getItem('nertz-player-library') || '{}'); } catch(e) { return {}; }
}
function saveLibraryLS(lib) {
  try { localStorage.setItem('nertz-player-library', JSON.stringify(lib)); } catch(e) {}
}
function refreshPlayerLibrary() {
  playerLibrary = Object.entries(loadLibraryLS()).map(([key, val]) => ({ key, ...val }));
}
// Write to localStorage (instant) + Firestore (cross-device)
function saveLibrary(lib) {
  saveLibraryLS(lib);
  refreshPlayerLibrary();
  db.collection('tournaments').doc('__playerLibrary__')
    .set({ data: lib, updatedAt: Date.now() })
    .catch(e => console.error('Library save error:', e));
}
function subscribeToLibrary() {
  if (unsubscribeLibrary) return;
  unsubscribeLibrary = db.collection('tournaments').doc('__playerLibrary__')
    .onSnapshot(doc => {
      if (!doc.exists || !doc.data().data) return;
      const lib = doc.data().data;
      saveLibraryLS(lib);
      refreshPlayerLibrary();
      render();
    }, err => console.error('Library listener error:', err));
}
let photoCache = {};
let openStageSettingsPanels = new Set();

const UI_FIELDS = new Set(['mode','screen','adminTab','stageFilter','playerStageFilter','playerGameFilter','activeGroupId','scoringModal','adminAuthModal','pickerCreating','roundInputs','lbSort','lbStage','libraryEditModal']);

function save() {
  if (!S.tournamentId) return;
  const data = {};
  Object.keys(S).forEach(k => { if (!UI_FIELDS.has(k)) data[k] = S[k]; });
  db.collection('tournaments').doc(S.tournamentId).set(data).catch(e => console.error('Save error:', e));
  localStorage.setItem('nertz2-active', S.tournamentId);
}

function subscribeToTournament(id) {
  if (unsubscribeTournament) unsubscribeTournament();
  let isFirst = true;
  localStorage.setItem('nertz2-active', id);
  unsubscribeTournament = db.collection('tournaments').doc(id).onSnapshot(doc => {
    if (!doc.exists) return;
    const data = doc.data();
    // Strip UI_FIELDS from Firestore data to prevent stale saved UI state from overriding current UI
    const remoteData = Object.fromEntries(Object.entries(data).filter(([k]) => !UI_FIELDS.has(k)));
    if (isFirst) {
      isFirst = false;
      photoCache = {};
      if (S.tournamentId === id) {
        S = { ...S, ...remoteData, settings: { ...DEF.settings, ...(remoteData.settings||{}) } };
      } else {
        S = { ...DEF, ...remoteData, tournamentId: id,
          settings: { ...DEF.settings, ...(remoteData.settings||{}) },
          screen: 'home', mode: 'player', scoringModal: null, roundInputs: {}, adminAuthModal: false };
      }
      fixImproperlyCompletedStages();
      setTimeout(() => loadPhotos(id), 0);
    } else {
      S = { ...S, ...remoteData, tournamentId: id, settings: { ...DEF.settings, ...(remoteData.settings||{}) } };
    }
    render();
    // Safety net: if all groups in a shuffle stage are done, create the next round
    setTimeout(() => checkAndTriggerShuffles(), 0);
  }, err => console.error('Tournament listener error:', err));
}

function playerLibraryKey(name) {
  return name.toLowerCase().trim().replace(/\s+/g, '_').replace(/[^a-z0-9_]/g, '');
}

// Revert any stage marked complete that doesn't actually have all scores in.
// Runs on tournament load so legacy data is self-healing.
function fixImproperlyCompletedStages() {
  let changed = false;
  S.stages.forEach(stage => {
    if (stage.status === 'complete') {
      const groups = activeGroupsForStage(stage.id);
      if (groups.length > 0 && !stageIsFullyDone(stage.id)) {
        stage.status = 'active';
        changed = true;
      }
    }
  });
  if (changed) save();
}


function init() {

function upd(patch) { Object.assign(S, patch); save(); render(); }
function uid() { return Math.random().toString(36).slice(2,9); }

// =========================================================
// HELPERS
// =========================================================
function initials(name) {
  if (!name) return '?';
  return name.trim().split(/\s+/).map(w=>w[0]).join('').toUpperCase().slice(0,2);
}
function shortName(name) {
  if (!name) return '?';
  const parts = name.trim().split(/\s+/);
  if (parts.length === 1) return parts[0];
  return parts[0] + ' ' + parts[parts.length - 1][0].toUpperCase() + '.';
}
function escH(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function getPart(id) { return S.participants.find(p=>p.id===id); }
function getCol(id) { return S.collections.find(c=>c.id===id); }
function getGroup(id) { return S.groups.find(g=>g.id===id); }
function getGame(id) { return S.games.find(g=>g.id===id); }
function getStage(id) { return S.stages.find(s=>s.id===id); }

function activeGameForGroup(gid) {
  return S.games.find(g=>g.groupId===gid && !g.completed);
}
function completedGamesForGroup(gid) {
  return S.games.filter(g=>g.groupId===gid && g.completed);
}

function cumulative(game) {
  const res = {};
  game.participantIds.forEach(pid => { res[pid] = []; });
  game.rounds.forEach((round, i) => {
    game.participantIds.forEach(pid => {
      const prev = i > 0 ? res[pid][i-1] : 0;
      const v = round[pid];
      res[pid].push(prev + (v === 'NA' || v === undefined ? 0 : (Number(v)||0)));
    });
  });
  return res;
}

function playerRoundTotal(game, pid) {
  return game.rounds.reduce((s,r) => {
    const v = r[pid];
    return s + (v === 'NA' || v === undefined ? 0 : (Number(v)||0));
  }, 0);
}

function gameWinnerId(game) {
  const cum = cumulative(game);
  let max = -Infinity;
  game.participantIds.forEach(pid => {
    const sc = cum[pid]||[];
    const total = sc.length ? sc[sc.length-1] : 0;
    if (total > max) max = total;
  });
  const tied = game.participantIds.filter(pid => {
    const sc = cum[pid]||[];
    return (sc.length ? sc[sc.length-1] : 0) === max;
  });
  return tied.length === 1 ? tied[0] : null; // null = tie (multiple winners)
}

// Returns all players who share the top score (the tied co-winners).
// Used to credit each tied player with a win in stats.
function gameTiedWinnerIds(game) {
  const cum = cumulative(game);
  let max = -Infinity;
  game.participantIds.forEach(pid => {
    const sc = cum[pid]||[];
    const total = sc.length ? sc[sc.length-1] : 0;
    if (total > max) max = total;
  });
  return game.participantIds.filter(pid => {
    const sc = cum[pid]||[];
    return (sc.length ? sc[sc.length-1] : 0) === max;
  });
}

function gameIsOver(game) {
  const ss = game.stageId ? getStageSettings(game.stageId) : S.settings;
  const target = ss.pointsToWin;
  const cum = cumulative(game);
  return game.participantIds.some(pid => {
    const sc = cum[pid]||[];
    return sc.length > 0 && sc[sc.length-1] >= target;
  });
}

function creditWins(stats, game) {
  // On a clear win, credit one player. On a tie, credit all tied players with 1 win each.
  if (game.winnerId) {
    if (stats[game.winnerId]) stats[game.winnerId].gamesWon++;
  } else {
    gameTiedWinnerIds(game).forEach(pid => {
      if (stats[pid]) stats[pid].gamesWon++;
    });
  }
}

function allStats() {
  const stats = {};
  S.participants.forEach(p => { stats[p.id] = {totalPoints:0, gamesWon:0, gamesPlayed:0}; });
  S.games.filter(g=>g.completed).forEach(game => {
    game.participantIds.forEach(pid => {
      if (!stats[pid]) stats[pid] = {totalPoints:0, gamesWon:0, gamesPlayed:0};
      stats[pid].gamesPlayed++;
      stats[pid].totalPoints += playerRoundTotal(game, pid);
    });
    creditWins(stats, game);
  });
  return stats;
}

// Stats scoped to games played within a specific stage (for fair advancement ranking).
function stageStats(stageId) {
  const stageGroupIds = new Set(S.groups.filter(g => g.stageId === stageId && !g.isCatchup).map(g => g.id));
  const stats = {};
  S.participants.forEach(p => { stats[p.id] = {totalPoints:0, gamesWon:0, gamesPlayed:0}; });
  S.games.filter(g => g.completed && stageGroupIds.has(g.groupId)).forEach(game => {
    game.participantIds.forEach(pid => {
      if (!stats[pid]) stats[pid] = {totalPoints:0, gamesWon:0, gamesPlayed:0};
      stats[pid].gamesPlayed++;
      stats[pid].totalPoints += playerRoundTotal(game, pid);
    });
    creditWins(stats, game);
  });
  return stats;
}

function unassigned(stageId) {
  const assigned = new Set(S.groups.filter(g=>g.stageId===stageId).flatMap(g=>g.participantIds));
  return S.participants.filter(p=>!assigned.has(p.id));
}

function colorsForParticipant(pid) {
  const p = getPart(pid);
  if (!p || !p.collectionId) return null;
  return getCol(p.collectionId);
}

// Distribute `total` players into groups of at most `maxSize`, never smaller than `minSize`.
// When there's a leftover smaller than minSize, borrow players from full groups
// so the last group reaches minSize (reducing some full groups to maxSize-1).
function distributeGroups(total, maxSize, minSize) {
  const mn = Math.min(minSize, maxSize);
  if (total === 0) return [];
  if (total <= maxSize) return [total];
  const numFull = Math.floor(total / maxSize);
  const remainder = total % maxSize;
  if (remainder === 0) return Array(numFull).fill(maxSize);
  if (remainder >= mn) return [...Array(numFull).fill(maxSize), remainder];
  // Remainder too small — borrow from full groups
  const deficit = mn - remainder;
  if (deficit <= numFull && maxSize - 1 >= mn) {
    const sizes = Array(numFull).fill(maxSize);
    for (let i = 0; i < deficit; i++) sizes[i]--;
    return [...sizes, remainder + deficit];
  }
  // Fallback: simple chunking (edge case — constraints can't be satisfied)
  const sizes = [];
  for (let i = 0; i < total; i += maxSize) sizes.push(Math.min(maxSize, total - i));
  return sizes;
}

// Returns the effective settings for a stage, falling back to global settings.
function getStageSettings(stageId) {
  const stage = getStage(stageId);
  const ss = stage?.settings || {};
  const gs = S.settings;
  return {
    gameSize:              ss.gameSize              ?? gs.gameSize,
    minGroupSize:          ss.minGroupSize          ?? gs.minGroupSize,
    gamesPerStage:         ss.gamesPerStage         ?? gs.gamesPerStage,
    pointsToWin:           ss.pointsToWin           ?? gs.pointsToWin,
    shuffleAfterGame:      ss.shuffleAfterGame      ?? gs.shuffleAfterGame,
    advancementMethod:     ss.advancementMethod     ?? gs.advancementMethod,
    advancersPerCollection: ss.advancersPerCollection ?? gs.advancersPerCollection ?? gs.advancersPerGroup ?? 1,
    mixCollections:        ss.mixCollections        ?? false,
    groupAssignment:       ss.groupAssignment       ?? 'manual',
    isFinal:               ss.isFinal              ?? false,
  };
}

// Returns groups in a stage that belong to the current (highest) round.
// Returns the collection key for a group based on its first player's collectionId.
function groupColKey(group, ss) {
  if (ss && ss.mixCollections) return '__all__';
  const pid = group.participantIds && group.participantIds[0];
  return pid ? (getPart(pid)?.collectionId || '__all__') : '__all__';
}

// Excludes catch-up groups. In shuffle mode returns the highest-round groups
// per collection independently (so different collections can be on different rounds).
function activeGroupsForStage(stageId) {
  const groups = S.groups.filter(g => g.stageId === stageId && !g.isCatchup);
  if (!groups.length) return [];
  const ss = getStageSettings(stageId);
  if (!ss.shuffleAfterGame) {
    const maxRound = Math.max(...groups.map(g => g.round || 1));
    return groups.filter(g => (g.round || 1) === maxRound);
  }
  // Shuffle mode: per-collection max-round groups
  const byCol = {};
  groups.forEach(g => {
    const k = groupColKey(g, ss);
    if (!byCol[k]) byCol[k] = [];
    byCol[k].push(g);
  });
  const result = [];
  Object.values(byCol).forEach(colGroups => {
    const maxRound = Math.max(...colGroups.map(g => g.round || 1));
    result.push(...colGroups.filter(g => (g.round || 1) === maxRound));
  });
  return result;
}

function stageCurrentRound(stageId) {
  const groups = S.groups.filter(g => g.stageId === stageId && !g.isCatchup);
  if (!groups.length) return 1;
  return Math.max(...groups.map(g => g.round || 1));
}

// Status of a single group: 'pending' | 'active' | 'final'
function groupStatus(groupId, stageId) {
  const active = activeGameForGroup(groupId);
  if (active) return 'active';
  const done = completedGamesForGroup(groupId);
  if (!done.length) return 'pending';
  const ss = getStageSettings(stageId);
  // In shuffle mode each group plays exactly 1 game before players are reassigned
  const gps = ss.shuffleAfterGame ? 1 : (ss.gamesPerStage || 1);
  return done.length >= gps ? 'final' : 'active';
}

// True when every previous-stage group containing any of this group's players is 'final'.
function prevStageCompleteForGroup(group, stageIdx) {
  const prevStage = S.stages[stageIdx - 1];
  const prevGroupIds = new Set();
  group.participantIds.forEach(pid => {
    S.groups.filter(g => g.stageId === prevStage.id && !g.isCatchup && g.participantIds.includes(pid))
      .forEach(pg => prevGroupIds.add(pg.id));
  });
  if (!prevGroupIds.size) return true;
  return [...prevGroupIds].every(gid => groupStatus(gid, prevStage.id) === 'final');
}

// True when every active group in the stage has completed all required games.
function stageIsFullyDone(stageId) {
  const groups = activeGroupsForStage(stageId);
  if (!groups.length) return false;
  return groups.every(g => groupStatus(g.id, stageId) === 'final');
}

// True when a stage is done: either explicitly marked complete by admin, or all games finished.
function stageEffectiveDone(stage) {
  return stage.status === 'complete' || stageIsFullyDone(stage.id);
}

// Returns the tournament winner(s) if the final stage is complete, else [].
function getTournamentWinners() {
  if (!S.stages.length) return [];
  const finalStage = S.stages[S.stages.length - 1];
  if (!stageIsFullyDone(finalStage.id)) return [];
  const ss = getStageSettings(finalStage.id);
  const method = ss.advancementMethod || 'wins';
  const stats = stageStats(finalStage.id);
  const finalGroupIds = new Set(S.groups.filter(g => g.stageId === finalStage.id && !g.isCatchup).map(g => g.id));
  const finalPids = [...new Set(S.games.filter(g => finalGroupIds.has(g.groupId)).flatMap(g => g.participantIds))];
  if (!finalPids.length) return [];
  const ranked = [...finalPids].sort((a, b) => {
    const sa = stats[a]||{}, sb = stats[b]||{};
    return method === 'wins'
      ? (sb.gamesWon - sa.gamesWon) || (sb.totalPoints - sa.totalPoints)
      : (sb.totalPoints - sa.totalPoints) || (sb.gamesWon - sa.gamesWon);
  });
  const topSt = stats[ranked[0]] || {};
  const winners = [ranked[0]];
  for (let i = 1; i < ranked.length; i++) {
    const st = stats[ranked[i]] || {};
    const tied = method === 'wins'
      ? (topSt.gamesWon === st.gamesWon && topSt.totalPoints === st.totalPoints)
      : (topSt.totalPoints === st.totalPoints && topSt.gamesWon === st.gamesWon);
    if (tied) winners.push(ranked[i]);
    else break;
  }
  return winners;
}

// Returns how many complete game cycles have finished in a stage.
// Shuffle mode: counts completed reshuffle rounds.
// Keep Group mode: counts completed games at each (fixed) group.
function stageRoundsComplete(stageId) {
  const active = activeGroupsForStage(stageId);
  if (!active.length) return 0;
  const ss = getStageSettings(stageId);
  if (ss.shuffleAfterGame) {
    const curRound = stageCurrentRound(stageId);
    const allDone = active.every(g => completedGamesForGroup(g.id).length > 0);
    return allDone ? curRound : curRound - 1;
  } else {
    return Math.min(...active.map(g => completedGamesForGroup(g.id).length));
  }
}

function avatarBg(pid) {
  const photo = photoCache[pid];
  if (!photo) return '';
  return `background-image:url(${photo});background-size:cover;background-position:center;color:transparent;`;
}

function loadPhotos(tid) {
  if (!tid || !S.participants.length) return;
  // Immediately show photos from localStorage library as fallback
  const lib = loadLibraryLS();
  let localHit = false;
  S.participants.forEach(p => {
    if (!photoCache[p.id]) {
      const key = playerLibraryKey(p.name);
      if (lib[key]?.photo) { photoCache[p.id] = lib[key].photo; localHit = true; }
    }
  });
  if (localHit) render();
  // Then fetch from Firestore — overwrites with the definitive saved version
  const promises = S.participants.map(p =>
    db.collection('playerPhotos').doc(tid + '_' + p.id).get()
  );
  Promise.all(promises).then(docs => {
    let updated = false;
    docs.forEach(doc => {
      if (doc.exists && doc.data().photo) {
        const pid = doc.id.replace(tid + '_', '');
        photoCache[pid] = doc.data().photo;
        updated = true;
      }
    });
    if (updated) render();
  }).catch(e => console.error('Photo load error:', e));
}

function savePhotoToFirestore(pid, dataUrl) {
  if (!S.tournamentId) return;
  db.collection('playerPhotos').doc(S.tournamentId + '_' + pid)
    .set({ photo: dataUrl, updatedAt: Date.now() })
    .catch(e => console.error('Photo save error:', e));
  const p = getPart(pid);
  if (p) {
    const key = playerLibraryKey(p.name);
    const lib = loadLibraryLS();
    lib[key] = { ...lib[key], name: p.name, photo: dataUrl, updatedAt: Date.now() };
    saveLibrary(lib);
  }
}

function openFilePicker(pid, libraryKey) {
  if (!pid && !libraryKey) return;
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.style.display = 'none';
  document.body.appendChild(inp);
  inp.addEventListener('change', () => {
    const file = inp.files[0];
    document.body.removeChild(inp);
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        cropState = libraryKey
          ? { libraryKey, img, offsetX: 0, offsetY: 0, zoom: 1 }
          : { playerId: pid, img, offsetX: 0, offsetY: 0, zoom: 1 };
        render();
        setTimeout(() => { drawCropCanvas(); setupCropDrag(); }, 50);
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
  inp.click();
}

function drawCropCanvas() {
  const canvas = document.getElementById('crop-canvas');
  if (!canvas || !cropState || !cropState.img) return;
  const ctx = canvas.getContext('2d');
  const size = 240;
  ctx.clearRect(0, 0, size, size);
  ctx.save();
  ctx.beginPath();
  ctx.arc(size/2, size/2, size/2, 0, Math.PI*2);
  ctx.clip();
  const img = cropState.img;
  const baseScale = Math.max(size/img.naturalWidth, size/img.naturalHeight) * cropState.zoom;
  const imgW = img.naturalWidth * baseScale;
  const imgH = img.naturalHeight * baseScale;
  ctx.drawImage(img, size/2 + cropState.offsetX - imgW/2, size/2 + cropState.offsetY - imgH/2, imgW, imgH);
  ctx.restore();
}

function setupCropDrag() {
  const canvas = document.getElementById('crop-canvas');
  if (!canvas || !cropState) return;
  const zoomInp = document.getElementById('crop-zoom');
  if (zoomInp) {
    zoomInp.value = cropState.zoom;
    zoomInp.addEventListener('input', () => { cropState.zoom = parseFloat(zoomInp.value); drawCropCanvas(); });
  }
  let lastX = 0, lastY = 0, dragging = false;
  const onStart = (x, y) => { dragging = true; lastX = x; lastY = y; canvas.style.cursor = 'grabbing'; };
  const onMove = (x, y) => {
    if (!dragging) return;
    cropState.offsetX += x - lastX; cropState.offsetY += y - lastY;
    lastX = x; lastY = y; drawCropCanvas();
  };
  const onEnd = () => { dragging = false; canvas.style.cursor = 'grab'; };
  canvas.addEventListener('mousedown', e => { e.preventDefault(); onStart(e.clientX, e.clientY); });
  window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
  window.addEventListener('mouseup', onEnd);
  canvas.addEventListener('touchstart', e => { e.preventDefault(); onStart(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});
  canvas.addEventListener('touchmove', e => { e.preventDefault(); onMove(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});
  canvas.addEventListener('touchend', onEnd);
}

function doApplyPhotoCrop() {
  if (!cropState) return;
  const out = document.createElement('canvas');
  out.width = 200; out.height = 200;
  const ctx = out.getContext('2d');
  ctx.beginPath(); ctx.arc(100, 100, 100, 0, Math.PI*2); ctx.clip();
  const img = cropState.img;
  const scale200 = 200/240;
  const baseScale = Math.max(240/img.naturalWidth, 240/img.naturalHeight) * cropState.zoom;
  const imgW = img.naturalWidth * baseScale * scale200;
  const imgH = img.naturalHeight * baseScale * scale200;
  ctx.drawImage(img, 100 + cropState.offsetX*scale200 - imgW/2, 100 + cropState.offsetY*scale200 - imgH/2, imgW, imgH);
  const dataUrl = out.toDataURL('image/jpeg', 0.82);
  if (cropState.libraryKey) {
    const key = cropState.libraryKey;
    cropState = null;
    const lib = loadLibraryLS();
    if (lib[key]) { lib[key] = { ...lib[key], photo: dataUrl, updatedAt: Date.now() }; saveLibrary(lib); }
    render();
  } else {
    const pid = cropState.playerId;
    cropState = null;
    photoCache[pid] = dataUrl;
    savePhotoToFirestore(pid, dataUrl);
    render();
  }
}

function rulesSection(label, section, accentColor, extra='') {
  const raw = rulesText(section);
  let text;

    text = raw.split('\n').map(line => {
      if (line.startsWith('• ')) {

      }
      return line ? `<div style="margin-bottom:6px">${line}</div>` : '';
    }).join('');
  } else {
    text = raw.replace(/\n/g, '<br>');
  }
  return `<div class="card" style="padding:18px 20px">
    <div style="font-size:13px;font-weight:800;color:${accentColor};letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px">${label}</div>

}

        ${rulesSection('Gameplay', 'gameplay', 'var(--accent)', buildGameplayDiagram())}
        ${rulesSection('Scoring', 'scoring', 'var(--accent)')}
        ${rulesSection('House Rules', 'houseRules', 'var(--gold)')}
      </div>
    </div>`;
}

function buildTournamentSummary() {
  if (!S.stages.length) return [];
  const bullets = [];
  const pts = S.settings.pointsToWin;
  const stage1 = S.stages[0];
  const ss1 = getStageSettings(stage1.id);
  const gps1 = ss1.gamesPerStage || 1;

  bullets.push('Click <strong>Groups</strong> to find your first group assignment.');

  if (pts) {
    bullets.push(`In each game, unlimited rounds are played until a player reaches at least <strong>${pts} points</strong>.`);
  }

  if (ss1.shuffleAfterGame) {
    bullets.push('After each game, you will be assigned to a new group to play.');
  }

  if (gps1 > 1) {
    bullets.push(`Each player plays <strong>${gps1} games</strong> in ${escH(stage1.name)}.`);
  }

  S.stages.forEach((stage, idx) => {
    const ss = getStageSettings(stage.id);
    const nextStage = S.stages[idx + 1];
    const isLast = idx === S.stages.length - 1;
    if (isLast || ss.isFinal) {
      const gps = ss.gamesPerStage || 1;
      bullets.push(`The top players will play <strong>${gps} game${gps !== 1 ? 's' : ''}</strong> for the championship win.`);
    } else if (nextStage) {
      const n = ss.advancersPerCollection || 1;
      const perWhat = ss.mixCollections ? 'overall' : (n === 1 ? 'from each group' : 'from each collection');
      const topStr = n === 1 ? 'The top player' : `The top <strong>${n} players</strong>`;
      bullets.push(`${topStr} ${perWhat} will progress to <strong>${escH(nextStage.name)}</strong>.`);
    }
  });

  return bullets;
}

function renderGroupGameTable(g, group, opts) {
  const isCurrent = opts && opts.isCurrent;
  const showCurrent = opts && opts.showCurrent;
  const curRoundNum = (opts && opts.curRoundNum) || 1;
  const gcum = cumulative(g);
  const nRounds = g.rounds.length;
  let t = `<div class="sc-table-wrap"><table class="sc-table" style="width:100%;table-layout:fixed">
    <colgroup>
      <col style="width:auto">
      ${Array.from({length: nRounds}, () => '<col style="width:40px">').join('')}
      ${showCurrent ? '<col style="width:52px">' : ''}
      <col style="width:46px">
    </colgroup>
    <thead><tr>
      <th style="text-align:left;padding:5px 14px;font-size:11px">Player</th>
      ${Array.from({length: nRounds}, (_,i) => `<th style="font-size:11px">R${i+1}</th>`).join('')}
      ${showCurrent ? `<th style="font-size:11px;color:var(--accent)">R${curRoundNum}</th>` : ''}
      <th style="font-size:11px">Total</th>
    </tr></thead><tbody>`;
  group.participantIds.forEach(function(pid) {
    var p = getPart(pid);
    var sc = gcum[pid] || [];
    var total = sc.length ? sc[sc.length-1] : 0;
    var isWinner = g.completed && g.winnerId === pid;
    t += '<tr><td style="padding:5px 14px;font-size:13px;' + (isWinner ? 'font-weight:700;color:var(--gold)' : '') + '">' + escH(shortName(p ? p.name : '?')) + (isWinner ? ' 🏆' : '') + '</td>';
    (g.rounds || []).forEach(function(round, ri) {
      var v = round[pid];
      var canEdit = isCurrent && !g.completed;
      if (v === 'NA') {
        t += '<td style="text-align:center;font-size:11px;color:var(--muted)' + (canEdit ? ';cursor:pointer' : '') + '"' + (canEdit ? ' data-a="editRoundScore" data-gid="' + group.id + '" data-pid="' + pid + '" data-ri="' + ri + '"' : '') + '>—</td>';
      } else {
        var n = Number(v) || 0;
        var rt = sc[ri] !== undefined ? sc[ri] : 0;
        t += '<td style="text-align:center;font-size:11px' + (canEdit ? ';cursor:pointer' : '') + '" title="Running: ' + rt + '"' + (canEdit ? ' data-a="editRoundScore" data-gid="' + group.id + '" data-pid="' + pid + '" data-ri="' + ri + '"' : '') + '><span class="' + (n >= 0 ? 'pos' : 'neg') + '">' + (n >= 0 ? '+' : '') + n + '</span></td>';
      }
    });
    if (showCurrent) {
      var inp = (S.roundInputs[g?.id]||{})[pid];
      var hasVal = inp !== undefined && inp !== '';
      var isNA = inp === 'NA';
      t += '<td style="text-align:center;padding:3px 2px"><button class="btn btn-xs ' + (hasVal ? 'btn-ghost' : 'btn-primary') + '" data-a="enterGroupScore" data-gid="' + group.id + '" data-pid="' + pid + '" style="min-width:34px;padding:3px 4px;font-size:11px">' + (isNA ? '—' : hasVal ? ((Number(inp) >= 0 ? '+' : '') + inp) : '+') + '</button></td>';
    }
    t += '<td style="text-align:center;font-weight:700;font-size:12px" class="' + (total >= 0 ? 'pos' : 'neg') + '">' + total + '</td></tr>';
  });
  t += '</tbody></table></div>';
  return t;
}

function buildGroups() {
  if (!S.stages.length) return `<div class="empty"><div class="empty-icon">🃏</div><p>No stages set up yet. Ask the admin to configure the tournament.</p></div>`;

  // Default to the first stage that isn't complete; fall back to last stage if all are done
  const firstActive = S.stages.find(st => !stageEffectiveDone(st)) || S.stages[S.stages.length - 1];
  const selectedSid = (S.playerStageFilter && S.stages.find(s => s.id === S.playerStageFilter))
    ? S.playerStageFilter : firstActive.id;
  const selectedStage = getStage(selectedSid);
  const ss = getStageSettings(selectedSid);
  const target = ss.pointsToWin;

  const groupsWinners = getTournamentWinners();
  const isFinalStageView = S.stages.length && selectedSid === S.stages[S.stages.length - 1].id && groupsWinners.length;
  let html = `<div class="stage-filter">
    ${S.stages.map(st => `<button class="sf-btn ${selectedSid===st.id?'active':''}" data-a="setPlayerSFilter" data-v="${st.id}">${escH(st.name)}</button>`).join('')}
  </div>`;
  if (isFinalStageView) {
    const wNames = groupsWinners.map(pid => escH(getPart(pid)?.name || '?')).join(' &amp; ');
    html += `<div class="winner-banner" style="margin:0 16px">🏆 ${wNames} ${groupsWinners.length > 1 ? 'tie for' : 'wins'} the tournament!</div>`;
  }

  // In shuffle mode with multiple games per stage, show a Game selector
  let selectedRound = 1;
  if (ss.shuffleAfterGame && (ss.gamesPerStage || 1) > 1) {
    const gamesPerStage = ss.gamesPerStage || 1;
    const allStageGroups = S.groups.filter(g => g.stageId === selectedSid && !g.isCatchup);
    const allRounds = [...new Set(allStageGroups.map(g => g.round || 1))].sort((a, b) => a - b);
    // Default: lowest round that has any active or pending group
    const firstOpenRound = allRounds.find(r => {
      return allStageGroups.filter(g => (g.round || 1) === r)
        .some(g => groupStatus(g.id, selectedSid) !== 'final');
    }) || allRounds[allRounds.length - 1] || 1;
    // Use saved filter only if it's a valid round that exists
    const saved = S.playerGameFilter;
    selectedRound = (saved && allRounds.includes(saved)) ? saved : firstOpenRound;
    // Show game buttons once groups exist; disabled placeholders for rounds not yet created
    if (allStageGroups.length > 0 && gamesPerStage > 1) {
      const roundBtns = [];
      for (let r = 1; r <= gamesPerStage; r++) {
        if (allRounds.includes(r)) {
          const hasOpen = allStageGroups.filter(g => (g.round||1)===r).some(g => groupStatus(g.id,selectedSid)!=='final');
          roundBtns.push(`<button class="sf-btn ${selectedRound===r?'active':''}" data-a="setPlayerGameFilter" data-v="${r}">Game ${r}${hasOpen?' ●':''}</button>`);
        } else {
          roundBtns.push(`<button class="sf-btn" style="opacity:0.4" disabled>Game ${r}</button>`);
        }
      }
      html += `<div class="stage-filter" style="margin-top:-8px">${roundBtns.join('')}</div>`;
    }
  }

  // Filter displayed groups to the selected round (in shuffle mode) or use per-collection active groups
  const stageGroups = ss.shuffleAfterGame && (ss.gamesPerStage || 1) > 1
    ? S.groups.filter(g => g.stageId === selectedSid && !g.isCatchup && (g.round || 1) === selectedRound)
    : activeGroupsForStage(selectedSid);

  if (!stageGroups.length) {
    const stageIdx = S.stages.findIndex(s => s.id === selectedSid);
    const prevStage = stageIdx > 0 ? S.stages[stageIdx - 1] : null;
    let emptyDetail = `<p>No groups in this stage yet — ask the admin to assign players.</p>`;
    if (prevStage && !stageEffectiveDone(prevStage)) {
      emptyDetail = `<p>${escH(prevStage.name)} is still in progress. Once it's complete the admin will advance players here.</p>`;
    }
    html += `<div class="empty"><div class="empty-icon">🃏</div>${emptyDetail}</div>`;
    return html;
  }

  // Show a brief how-to tip if no games in this stage have any rounds yet
  const stageHasAnyRounds = S.games.some(g => {
    const grp = getGroup(g.groupId);
    return grp && grp.stageId === selectedSid && g.rounds && g.rounds.length > 0;
  });
  if (!stageHasAnyRounds) {
    const anyActive = stageGroups.some(g => activeGameForGroup(g.id));
    if (anyActive) {
      html += `<div style="margin:0 16px;padding:10px 14px;background:rgba(79,142,247,.07);border:1px solid rgba(79,142,247,.18);border-radius:12px;font-size:13px;color:var(--text);line-height:1.5">
        <strong>How to score:</strong> Tap a player's row in the table to enter their round score, then tap <strong>Submit Round</strong> when everyone's score is in.
      </div>`;
    }
  }

  html += `<div style="display:flex;flex-direction:column;gap:14px;padding:0 16px 16px;">`;

  const currentStageIdx = S.stages.findIndex(s => s.id === selectedSid);

  stageGroups.forEach(group => {
    const activeGame = activeGameForGroup(group.id);
    const doneGames = completedGamesForGroup(group.id);
    const gameOver = activeGame ? gameIsOver(activeGame) : false;
    const showCurrentRound = !!activeGame && !gameOver;
    const status = groupStatus(group.id, selectedSid);
    const currentRoundNum = activeGame ? activeGame.rounds.length + 1 : 1;

    const statusBadge = status === 'pending'
      ? `<span class="badge badge-muted">Not Started</span>`
      : status === 'final'
      ? `<span class="badge badge-green">✓ Done</span>`
      : `<span class="badge badge-blue">● Active</span>`;

    const groupAvatars = group.participantIds.map(pid => {
      const p = getPart(pid);
      const col = p?.collectionId ? getCol(p.collectionId) : null;
      const bg = avatarBg(pid);
      const avStyle = bg || (col ? `background:${col.color};color:#fff;` : '');
      return `<div style="display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0">
        <div style="width:44px;height:44px;border-radius:50%;background:var(--surface2);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;${avStyle}">${bg?'':escH(initials(p?.name||'?'))}</div>
        <div style="font-size:10px;color:var(--muted);font-weight:700;max-width:48px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center">${escH((p?.name||'?').split(' ')[0])}</div>
      </div>`;
    }).join('');

    html += `<div class="card" style="padding:0;overflow:hidden">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px 6px">
        <div style="font-family:'Nunito',sans-serif;font-size:14px;font-weight:700">${escH(group.name)}</div>
        ${statusBadge}
      </div>
      <div style="display:flex;gap:10px;padding:6px 14px 10px;overflow-x:auto">
        ${groupAvatars}
      </div>`;

    if (status === 'pending' && !activeGame && !doneGames.length) {
      const prevStageDone = currentStageIdx <= 0 || prevStageCompleteForGroup(group, currentStageIdx);
      if (prevStageDone) {
        html += `<div style="padding:12px 14px">
          <button class="btn btn-primary btn-sm" data-a="startGroupGame" data-gid="${group.id}">▶ Start Game</button>
        </div>`;
      } else {
        const prevStageName = S.stages[currentStageIdx - 1].name;
        html += `<div style="padding:10px 14px;font-size:13px;color:var(--muted);line-height:1.5;text-align:center">
          ⏳ Awaiting completion of ${escH(prevStageName)} games.
        </div>`;
      }
    } else {
      // Active game (current round entry)
      if (activeGame) {
        html += renderGroupGameTable(activeGame, group, {isCurrent:true, showCurrent:showCurrentRound, curRoundNum:currentRoundNum});
        if (showCurrentRound) {
          const scoredCount = group.participantIds.filter(pid => {
            const inp = (S.roundInputs[activeGame?.id]||{})[pid];
            return inp !== undefined && inp !== '';
          }).length;
          const totalCount = group.participantIds.length;
          const allHaveInput = scoredCount === totalCount;
          if (allHaveInput) {
            html += `<div style="padding:8px 14px 12px;display:flex;flex-direction:column;gap:8px">
              <div style="font-size:12px;color:var(--green);font-weight:700;text-align:center">✓ All ${totalCount} scores entered</div>
              <button class="btn btn-primary btn-full" data-a="submitRound" data-gid="${activeGame.id}">
                Submit Round ${currentRoundNum}
              </button>
            </div>`;
          } else {
            html += `<div style="padding:6px 14px 12px;display:flex;align-items:center;justify-content:space-between">
              <span style="font-size:13px;color:var(--muted)">Tap a player's score to enter it</span>
              <span style="font-size:13px;font-weight:700;color:${scoredCount>0?'var(--accent)':'var(--muted)'}">${scoredCount}/${totalCount} scored</span>
            </div>`;
          }
        } else if (gameOver) {
          const wid = gameWinnerId(activeGame);
          const wp = wid ? getPart(wid) : null;
          let winnerBanner;
          if (wp) {
            winnerBanner = `<div class="sc-winner-banner">🏆 ${escH(wp.name)} wins this game!</div>`;
          } else {
            const cumG = cumulative(activeGame);
            const maxG = Math.max(...activeGame.participantIds.map(pid => { const sc=cumG[pid]||[]; return sc.length?sc[sc.length-1]:0; }));
            const tiedNamesG = activeGame.participantIds.filter(pid => { const sc=cumG[pid]||[]; return (sc.length?sc[sc.length-1]:0)===maxG; }).map(pid=>getPart(pid)?.name||'?');
            winnerBanner = `<div class="sc-winner-banner" style="background:rgba(79,142,247,.1);border-color:rgba(79,142,247,.25);color:var(--accent)">🤝 Tie — ${tiedNamesG.map(n=>escH(n)).join(' &amp; ')}! Each gets 1 win.</div>`;
          }
          html += `<div style="padding:8px 14px 12px;display:flex;flex-direction:column;gap:8px">
            ${winnerBanner}
            <button class="btn btn-gold btn-full" data-a="completeGame" data-gid="${activeGame.id}">Save &amp; Complete Game</button>
          </div>`;
        }
      }

      // Completed game history — show ALL past games
      if (doneGames.length) {
        doneGames.forEach((dg, gi) => {
          const winner = getPart(dg.winnerId);
          const showGameLabel = doneGames.length > 1 || !!activeGame;
          if (showGameLabel || !activeGame) {
            const labelTxt = showGameLabel ? `Game ${gi+1}` : 'Completed Game';
            html += `<div style="display:flex;align-items:center;justify-content:space-between;padding:${activeGame?'8px':'4px'} 14px 4px;${activeGame?'border-top:1px solid var(--border)':''}">
              <span style="font-size:11px;font-weight:700;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase">${labelTxt}</span>
              ${winner ? `<span style="font-size:11px;color:var(--gold);font-weight:700">🏆 ${escH(shortName(winner.name))}</span>` : ''}
            </div>`;
          }
          html += renderGroupGameTable(dg, group, {isCurrent:false, showCurrent:false});
        });
      }

      // Start Next Game button (only when groups stay fixed between games)
      if (!activeGame && status !== 'final') {
        if (ss.shuffleAfterGame) {
          html += `<div style="padding:8px 14px 12px;font-size:13px;color:var(--muted);line-height:1.5;text-align:center">
            ⏳ Waiting for all players to finish their game. You'll be assigned to a new group for the next game.
          </div>`;
        } else {
          html += `<div style="padding:8px 14px 12px">
            <button class="btn btn-primary btn-sm" data-a="startGroupGame" data-gid="${group.id}">▶ Start Next Game</button>
          </div>`;
        }
      }
    }

    html += `</div>`;
  });

  html += `</div>`;
  return html;
}

function buildRanking() {

function buildBrackets() {
  if (!S.stages.length) return `<div class="empty"><div class="empty-icon">🏆</div><p>No stages set up yet. Ask the admin to configure the tournament.</p></div>`;

  let html = '<div style="padding:16px;display:flex;flex-direction:column;gap:20px;">';
  S.stages.forEach(stage => {
    const ssB = getStageSettings(stage.id);
    const gpsB = ssB.gamesPerStage || 1;
    const groups = activeGroupsForStage(stage.id);
    const rdoneB = stageRoundsComplete(stage.id);
    const roundLabel = gpsB > 1 ? ` · Game ${rdoneB + 1}/${gpsB}` : '';
    html += `<div class="stage-block">
      <div class="stage-label">${escH(stage.name)}${roundLabel} ${stage.status==='complete'?'<span class="badge badge-green">Complete</span>':''}</div>
      ${groups.length===0?`<div style="padding:0 16px;color:var(--muted);font-size:13px;">No groups yet</div>`:''}
      ${groups.map(group => {
        const game = activeGameForGroup(group.id) || completedGamesForGroup(group.id).slice(-1)[0];
        const cum = game ? cumulative(game) : null;
        return `<div class="bracket-group">
          <div class="bracket-group-hdr">
            <div class="bracket-group-name">${escH(group.name)}</div>
            ${game && !game.completed ? '<span class="badge badge-blue">● Active</span>' : ''}
            ${game && game.completed ? '<span class="badge badge-green">✓ Done</span>' : ''}
            ${!game ? '<span class="badge badge-muted">Not started</span>' : ''}
          </div>
          <div class="bracket-players">
            ${group.participantIds.map(pid => {
              const p = getPart(pid);
              const isWinner = game?.completed && game.winnerId === pid;
              const total = cum ? (()=>{ const sc=cum[pid]||[]; return sc.length?sc[sc.length-1]:0; })() : null;
              const bg = avatarBg(pid);
              return `<div class="bracket-player ${isWinner?'winner':''}">
                <div class="bracket-avatar ${isWinner?'winner-av':''}" style="${bg}">${bg?'':escH(initials(p?.name||'?'))}</div>
                <div class="bracket-pname ${isWinner?'winner':''}">${escH(p?.name||'?')}</div>
                ${total!==null?`<div class="fw7 ${total>=0?'pos':'neg'}">${total}</div>`:''}
                ${isWinner?'<span class="text-gold">🏆</span>':''}
              </div>`;
            }).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>`;
  });
  html += '</div>';
  return html;
}

function buildLeaderboard() {
  const sortKey = S.lbSort;

  // Stage filter: default to most recent stage, 'all' for all-time
  const firstActiveStage = S.stages.find(st => !stageEffectiveDone(st)) || S.stages[S.stages.length - 1] || null;
  const selectedStageId = S.lbStage === 'all'
    ? 'all'
    : (S.lbStage && S.stages.find(s => s.id === S.lbStage))
      ? S.lbStage
      : (firstActiveStage ? firstActiveStage.id : 'all');

  const stats = selectedStageId === 'all' ? allStats() : stageStats(selectedStageId);

  // For a stage view, only show players who participated in that stage
  let displayPlayers = [...S.participants];
  if (selectedStageId !== 'all') {
    const stageGroupIds = new Set(S.groups.filter(g => g.stageId === selectedStageId && !g.isCatchup).map(g => g.id));
    const stagePids = new Set(S.games.filter(g => stageGroupIds.has(g.groupId)).flatMap(g => g.participantIds));
    // Also include players assigned to groups even if no game started yet
    S.groups.filter(g => g.stageId === selectedStageId && !g.isCatchup).forEach(g => g.participantIds.forEach(pid => stagePids.add(pid)));
    displayPlayers = displayPlayers.filter(p => stagePids.has(p.id));
  }

  const sorted = [...displayPlayers].sort((a,b) => {
    const sa=stats[a.id]||{}, sb=stats[b.id]||{};
    if (sortKey==='played') return (sb.gamesPlayed-sa.gamesPlayed)||(sb.gamesWon-sa.gamesWon);
    if (sortKey==='wins') return (sb.gamesWon-sa.gamesWon)||(sb.totalPoints-sa.totalPoints);
    return (sb.totalPoints-sa.totalPoints)||(sb.gamesWon-sa.gamesWon);
  });

  if (!S.participants.length) return `<div class="empty"><div class="empty-icon">📊</div><p>No players yet. Ask the admin to add participants.</p></div>`;

  const lbWinners = getTournamentWinners();
  const lbWinnerIds = new Set(lbWinners.map(pid => pid));
  const showWinnerBanner = lbWinners.length > 0 &&
    (selectedStageId === 'all' || (S.stages.length && selectedStageId === S.stages[S.stages.length - 1].id));

  const medals = ['🥇','🥈','🥉'];
  return `
    <div class="section" style="gap:12px">
      ${showWinnerBanner ? `<div class="winner-banner">🏆 ${lbWinners.map(pid => escH(getPart(pid)?.name||'?')).join(' &amp; ')} ${lbWinners.length > 1 ? 'tie for' : 'wins'} the tournament!</div>` : ''}
      ${S.stages.length > 0 ? `<div class="stage-filter">
        ${S.stages.map(st => `<button class="sf-btn ${selectedStageId===st.id?'active':''}" data-a="setLbStage" data-v="${st.id}">${escH(st.name)}</button>`).join('')}
        <button class="sf-btn ${selectedStageId==='all'?'active':''}" data-a="setLbStage" data-v="all">All Time</button>
      </div>` : ''}
      <div class="lb-filters">
        <button class="lb-filter ${sortKey==='wins'?'active':''}" data-a="setLbSort" data-v="wins">Most Wins</button>
        <button class="lb-filter ${sortKey==='points'?'active':''}" data-a="setLbSort" data-v="points">Most Points</button>
        <button class="lb-filter ${sortKey==='played'?'active':''}" data-a="setLbSort" data-v="played">Games Played</button>
      </div>
      ${sorted.length === 0 ? `<div class="empty"><div class="empty-icon">📊</div><p>No games played in this stage yet.</p></div>` : `<div class="card">
        ${sorted.map((p,i) => {
          const st = stats[p.id]||{totalPoints:0,gamesWon:0,gamesPlayed:0};
          const col = p.collectionId?getCol(p.collectionId):null;
          const mainVal = sortKey==='wins' ? st.gamesWon : sortKey==='points' ? st.totalPoints : st.gamesPlayed;
          const mainLabel = sortKey==='wins' ? 'wins' : sortKey==='points' ? 'pts' : 'played';
          const sub = sortKey==='wins' ? `${st.gamesPlayed} played · ${st.totalPoints>=0?'+':''}${st.totalPoints} pts` :
                      sortKey==='points' ? `${st.gamesPlayed} played · ${st.gamesWon} wins` :
                      `${st.gamesWon} wins · ${st.totalPoints>=0?'+':''}${st.totalPoints} pts`;
          const lbBg = avatarBg(p.id);
          const isChamp = showWinnerBanner && lbWinnerIds.has(p.id);
          return `<div class="lb-row${isChamp?' lb-row-winner':''}">
            <div class="lb-rank">${isChamp ? '🏆' : i<3?medals[i]:i+1}</div>
            <div class="lb-avatar" style="${col&&!lbBg?`border-color:${isChamp?'var(--gold)':col.color};color:${isChamp?'var(--gold)':col.color};`:''}${lbBg}">
              ${lbBg?'':escH(initials(p.name))}
            </div>
            <div style="flex:1">
              <div class="lb-name" style="${isChamp?'color:var(--gold);font-weight:800':''}">${escH(p.name)}${isChamp?' 🏆':''}</div>
              <div style="font-size:11px;color:var(--muted)">${sub}</div>
            </div>
            <div class="lb-stat">
              <div class="lb-stat-val ${sortKey==='points'&&mainVal<0?'neg':'pos'}">${mainVal>=0&&sortKey==='points'?'+':''}${mainVal}</div>
              <div class="lb-stat-sub">${mainLabel}</div>
            </div>
          </div>`;
        }).join('')}
      </div>`}
    </div>`;
}

function buildScoresList() {
  const stages = S.stages;
  const filter = S.stageFilter;

  const filteredGroups = filter === 'all'
    ? S.stages.flatMap(st => activeGroupsForStage(st.id))
    : activeGroupsForStage(filter);

  return `
    <div class="stage-filter">
      <button class="sf-btn ${filter==='all'?'active':''}" data-a="setSFilter" data-v="all">All Stages</button>
      ${stages.map(st=>`<button class="sf-btn ${filter===st.id?'active':''}" data-a="setSFilter" data-v="${st.id}">${escH(st.name)}</button>`).join('')}
    </div>
    ${filteredGroups.length===0?`<div class="empty"><div class="empty-icon">✏️</div><p>No groups to score${filter!=='all'?' in this stage':''}.</p></div>`:''}
    <div class="card" style="margin:0 16px">
      ${filteredGroups.map(group => {
        const stage = getStage(group.stageId);
        const active = activeGameForGroup(group.id);
        const done = completedGamesForGroup(group.id);
        const players = group.participantIds.map(pid=>getPart(pid));
        return `<div class="group-list-item" data-a="openScorecard" data-gid="${group.id}">
          <div class="group-avatar">${active?'🟢':'♥'}</div>
          <div class="group-info">
            <div class="group-info-name">${escH(group.name)}</div>
            <div class="group-info-sub">${escH(stage?.name||'')} · ${players.map(p=>initials(p?.name||'?')).join(', ')} · ${done.length} game${done.length!==1?'s':''} done</div>
          </div>
          <div style="color:var(--border);font-size:20px">›</div>
        </div>`;
      }).join('')}
    </div>`;
}

function buildScorecard() {
  const gid = S.activeGroupId;
  const group = getGroup(gid);
  if (!group) return `<div class="empty"><p>Group not found.</p></div>`;

  const activeGame = activeGameForGroup(gid);
  const doneGames = completedGamesForGroup(gid);

  let html = '';

  if (activeGame) {
    html += buildActiveScorecardView(activeGame);
  } else {
    const stage = getStage(group.stageId);
    const ssSc = getStageSettings(group.stageId);
    const gps = ssSc.gamesPerStage || 1;
    const rdone = stageRoundsComplete(group.stageId);
    const roundInfo = gps > 1 ? ` · Game ${Math.min(rdone + 1, gps)}/${gps}` : '';
    html += `<div style="padding:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <span style="font-size:13px;color:var(--muted)">${escH(stage?.name||'')}${roundInfo} · ${group.participantIds.length} players</span>
      <button class="btn btn-primary btn-sm" data-a="startGame" data-gid="${gid}">▶ New Game</button>
    </div>`;
  }

  if (doneGames.length) {
    html += `<div class="sc-history">
      <div class="sc-history-title">Completed Games (${doneGames.length})</div>
      ${doneGames.map((game,i) => buildCompletedGameSummary(game, i+1)).join('')}
    </div>`;
  }

  if (!activeGame && !doneGames.length) {
    html += `<div class="empty"><div class="empty-icon">🎴</div><p>No games yet. Start a game to begin scoring.</p></div>`;
  }

  return html;
}

function buildActiveScorecardView(game) {
  const group4scv = getGroup(game.groupId);
  const ss4scv = group4scv ? getStageSettings(group4scv.stageId) : S.settings;
  const cum = cumulative(game);
  const target = ss4scv.pointsToWin;
  const over = gameIsOver(game);
  const round = S.roundInputs[game.id] || {};

  // Check which players have input for current round
  const hasRoundInput = pid => round[pid] !== undefined && round[pid] !== '';
  const allHaveInput = game.participantIds.every(pid => hasRoundInput(pid));

  const currentRoundNum = game.rounds.length + 1;

  let html = '';

  // Round header
  const group4sc = getGroup(game.groupId);
  const ss4sc = group4sc ? getStageSettings(group4sc.stageId) : S.settings;
  const gpsAct = ss4sc.gamesPerStage || 1;
  const rdoneAct = group4sc ? stageRoundsComplete(group4sc.stageId) : 0;
  const stageRoundLabel = gpsAct > 1 ? ` · Stage Game ${Math.min(rdoneAct + 1, gpsAct)}/${gpsAct}` : '';
  html += `<div class="sc-round-info" style="padding:14px 16px 4px">
    <div class="sc-round-label">${over?'Game Over':'Round '+currentRoundNum}</div>
    <div class="sc-target">Target: ${target} pts${stageRoundLabel}</div>
  </div>`;

  // Player tiles (current round input)
  if (!over) {
    html += `<div class="sc-players">`;
    game.participantIds.forEach(pid => {
      const p = getPart(pid);
      const col = p?.collectionId ? getCol(p.collectionId) : null;
      const inp = round[pid];
      const hasScore = inp !== undefined && inp !== '';
      const isNA = inp === 'NA';
      const sc = cum[pid]||[];
      const total = sc.length ? sc[sc.length-1] : 0;

      const scBg = avatarBg(pid);
      html += `<div class="sc-player-tile" data-a="openScoreModal" data-pid="${pid}">
        <div class="sc-avatar ${hasScore&&!isNA?'has-score':''} ${isNA?'is-na':''}" style="${col&&!scBg?`border-color:${col.color};`:''}${scBg}">
          ${scBg?'':escH(initials(p?.name||'?'))}
          ${hasScore?`<div class="sc-avatar-check">${isNA?'—':'✓'}</div>`:''}
        </div>
        <div class="sc-pname">${escH(p?.name||'?')}</div>
        <div class="sc-pscore ${total>=0?'pos':'neg'}">${total}</div>
      </div>`;
    });
    html += `</div>`;

    // Instruction
    const scoredCountSC = game.participantIds.filter(pid => hasRoundInput(pid)).length;
    const totalCountSC = game.participantIds.length;
    html += `<div style="padding:4px 16px 10px;display:flex;align-items:center;justify-content:space-between">
      <span style="font-size:13px;color:var(--muted)">${allHaveInput ? '✓ All scores entered' : 'Tap a player to enter their score'}</span>
      <span style="font-size:13px;font-weight:700;color:${allHaveInput?'var(--green)':scoredCountSC>0?'var(--accent)':'var(--muted)'}">${scoredCountSC}/${totalCountSC}</span>
    </div>`;
  }

  // Progress bars
  html += `<div class="sc-progress">`;
  game.participantIds.forEach(pid => {
    const p = getPart(pid);
    const sc = cum[pid]||[];
    const total = sc.length ? sc[sc.length-1] : 0;
    const pct = Math.min(100, Math.max(0, (total/target)*100));
    const hit = total >= target;
    html += `<div class="sc-progress-row">
      <div class="sc-progress-name">${escH(initials(p?.name||'?'))} ${escH((p?.name||'').split(' ')[0])}</div>
      <div class="sc-progress-bar-wrap"><div class="sc-progress-fill ${hit?'hit':''}" style="width:${pct}%"></div></div>
      <div class="sc-progress-pts ${hit?'text-gold':total>=0?'pos':'neg'}">${total}</div>
    </div>`;
  });
  html += `</div>`;

  // Actions
  html += `<div class="sc-actions">`;
  if (over) {
    const wid = gameWinnerId(game);
    const wp = wid ? getPart(wid) : null;
    if (wp) {
      html += `<div class="sc-winner-banner">🏆 ${escH(wp.name)} wins this game!</div>`;
    } else {
      // Tie: find all players sharing the top score
      const cum2 = cumulative(game);
      const max2 = Math.max(...game.participantIds.map(pid => { const sc=cum2[pid]||[]; return sc.length?sc[sc.length-1]:0; }));
      const tiedNames = game.participantIds.filter(pid => { const sc=cum2[pid]||[]; return (sc.length?sc[sc.length-1]:0)===max2; }).map(pid=>getPart(pid)?.name||'?');
      html += `<div class="sc-winner-banner" style="background:rgba(79,142,247,.1);border-color:rgba(79,142,247,.25);color:var(--accent)">🤝 Tie — ${tiedNames.map(n=>escH(n)).join(' & ')}! Each gets 1 win.</div>`;
    }
    html += `<button class="btn btn-gold btn-full" data-a="completeGame" data-gid="${game.id}">Save & Complete Game</button>`;
  } else if (allHaveInput) {
    html += `<button class="btn btn-primary btn-full" data-a="submitRound" data-gid="${game.id}">Submit Round ${currentRoundNum}</button>`;
    if (game.rounds.length >= 1) {
      html += `<button class="btn btn-ghost btn-full btn-sm" data-a="endGame" data-gid="${game.id}">End Game Early</button>`;
    }
  } else if (game.rounds.length >= 1) {
    html += `<button class="btn btn-ghost btn-full btn-sm" data-a="endGame" data-gid="${game.id}">End Game Early</button>`;
  }
  html += `</div>`;

  // Round history
  if (game.rounds.length > 0) {
    html += buildRoundHistory(game, cum);
  }

  return html;
}

function buildRoundHistory(game, cum) {
  const players = game.participantIds.map(pid=>getPart(pid));
  let html = `<div class="sc-history">
    <div class="sc-history-title">Round History</div>
    <div class="sc-table-wrap"><table class="sc-table">
      <thead><tr>
        <th class="round-col">Rd</th>
        ${players.map(p=>`<th>${escH(initials(p?.name||'?'))}</th>`).join('')}
      </tr></thead>
      <tbody>`;

  game.rounds.forEach((round, ri) => {
    html += `<tr>
      <td class="round-col">${ri+1}</td>
      ${game.participantIds.map(pid => {
        const v = round[pid];
        const total = (cum[pid]||[])[ri]||0;
        if (v === 'NA') return `<td class="na-cell">N/A</td>`;
        const n = Number(v)||0;
        return `<td>
          <div class="${n>=0?'pos':'neg'}">${n>=0?'+':''}${n}</div>
          <div style="font-size:10px;color:var(--muted)">${total}</div>
        </td>`;
      }).join('')}
    </tr>`;
  });

  // Totals row
  html += `<tr class="total-row">
    <td class="round-col" style="font-weight:700">Total</td>
    ${game.participantIds.map(pid => {
      const sc = cum[pid]||[];
      const total = sc.length?sc[sc.length-1]:0;
      return `<td class="${total>=0?'pos':'neg'}" style="font-weight:700">${total}</td>`;
    }).join('')}
  </tr>`;

  html += `</tbody></table></div></div>`;
  return html;
}

function buildCompletedGameSummary(game, num) {
  const cum = cumulative(game);
  const winner = getPart(game.winnerId);
  const players = game.participantIds.map(pid=>getPart(pid));

  return `<div style="border-top:1px solid var(--border)">
    <div style="display:flex;align-items:center;gap:10px;padding:12px 16px">
      <div style="font-size:13px;color:var(--muted);font-weight:700">Game ${num}</div>
      <span class="badge badge-gold">🏆 ${escH(winner?.name||'?')}</span>
    </div>
    <div class="sc-table-wrap"><table class="sc-table">
      <thead><tr>
        <th class="round-col">Rd</th>
        ${players.map(p=>`<th ${game.winnerId===p?.id?'class="winner-col"':''}>${escH(initials(p?.name||'?'))}</th>`).join('')}
      </tr></thead>
      <tbody>
        ${game.rounds.map((round,ri)=>`<tr>
          <td class="round-col">${ri+1}</td>
          ${game.participantIds.map(pid=>{
            const v=round[pid], total=(cum[pid]||[])[ri]||0;
            if(v==='NA') return `<td class="na-cell">N/A</td>`;
            const n=Number(v)||0;
            return `<td ${game.winnerId===pid?'class="winner-col"':''}><div class="${n>=0?'pos':'neg'}">${n>=0?'+':''}${n}</div><div style="font-size:10px;color:var(--muted)">${total}</div></td>`;
          }).join('')}
        </tr>`).join('')}
        <tr class="total-row">
          <td class="round-col" style="font-weight:700">Final</td>
          ${game.participantIds.map(pid=>{
            const sc=cum[pid]||[];
            const total=sc.length?sc[sc.length-1]:0;
            return `<td ${game.winnerId===pid?'class="winner-col"':''}><span class="${total>=0?'pos':'neg'}">${total}</span></td>`;
          }).join('')}
        </tr>
      </tbody>
    </table></div>
  </div>`;
}

function buildScoreModal() {
  const pid = S.scoringModal.pid;
  const editRound = S.scoringModal.editRound; // undefined = current round, number = editing past round
  const p = getPart(pid);
  const col = p?.collectionId ? getCol(p.collectionId) : null;
  const game = activeGameForGroup(S.activeGroupId);
  const cum = game ? cumulative(game) : {};
  const sc = cum[pid]||[];

  let curVal, isNA, total, roundLabel;
  if (editRound !== undefined && game) {
    // Use roundInputs[game.id][pid] since doOpenEditScoreModal pre-seeds it
    curVal = (S.roundInputs[game?.id]||{})[pid];
    isNA = curVal === 'NA';
    // Running total up to the round before this one
    const prevTotal = editRound > 0 ? ((cum[pid]||[])[editRound-1] || 0) : 0;
    total = prevTotal;
    roundLabel = `Round ${editRound + 1}`;
  } else {
    curVal = (S.roundInputs[game?.id]||{})[pid];
    isNA = curVal === 'NA';
    total = sc.length ? sc[sc.length-1] : 0;
    roundLabel = null;
  }

  const smBg = avatarBg(pid);
  const smAvStyle = smBg ? smBg : (col ? `background:${col.color}` : '');
  const activeGame4modal = activeGameForGroup(S.activeGroupId);
  const currentRoundNum4modal = activeGame4modal ? activeGame4modal.rounds.length + 1 : 1;
  const ss4modal = S.activeGroupId ? getStageSettings(getGroup(S.activeGroupId)?.stageId) : S.settings;
  const target4modal = ss4modal?.pointsToWin || S.settings.pointsToWin;
  const roundHeading = roundLabel ? `Editing ${roundLabel}` : `Round ${currentRoundNum4modal} Score`;
  return `<div class="overlay" data-a="closeModal">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div style="text-align:center;font-size:13px;font-weight:800;color:var(--accent);padding:6px 0 2px;letter-spacing:0.05em;text-transform:uppercase">${roundHeading}</div>
      <div class="sheet-player">
        <div class="sheet-avatar" style="${smAvStyle}">
          ${smBg?'':escH(initials(p?.name||'?'))}
        </div>
        <div class="sheet-name">${escH(p?.name||'?')}</div>
        <div class="sheet-total">${roundLabel ? 'Total before this round' : 'Running total'}: <strong class="${total>=0?'pos':'neg'}">${total}</strong> <span style="color:var(--muted);font-weight:400">· first to ${target4modal} wins</span></div>
      </div>
      <div style="font-size:12px;color:var(--muted);text-align:center;margin-bottom:8px">Enter points earned this round (can be negative)</div>
      <input type="number" class="score-input-xl" id="score-inp" value="${isNA?'':(curVal!==''&&curVal!==undefined?curVal:'')}"
        placeholder="e.g. +12, -3, 0" ${isNA?'disabled':''}>
      <div class="na-toggle ${isNA?'active':''}" data-a="toggleNA" data-pid="${pid}">
        ${isNA?'✓ ':''} N/A — Player sat out this round
      </div>
      <button class="btn btn-primary btn-full" data-a="saveScore" data-pid="${pid}">
        Save Score
      </button>
      <button class="btn btn-ghost btn-xs" data-a="openPhotoCrop" data-pid="${pid}" style="margin-top:10px;width:100%">📷 ${smBg?'Change':'Add'} Photo</button>
    </div>
  </div>`;
}
